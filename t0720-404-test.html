<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <title>07:20 404 TEST</title>
  <style>
    html,body,iframe{width:100%;height:100%;margin:0;border:0;display:block;background:#050813}
    html,body{overflow:hidden}
    #loading{position:fixed;inset:0;display:grid;place-items:center;color:#efe8da;background:#050813;font:900 13px ui-monospace,monospace;letter-spacing:.18em}
  </style>
</head>
<body>
  <div id="loading">NOW LOADING</div>
  <iframe
    id="event"
    title="科学技術部のゲーム案内所"
    src="https://science-club-event-private.ink3-tomo-0827.workers.dev/__test_0720"
    allow="fullscreen; autoplay; gamepad; clipboard-read; clipboard-write"
    allowfullscreen
  ></iframe>
  <script>
    (()=>{
      const frame=document.getElementById('event');
      const base='https://science-club-event-private.ink3-tomo-0827.workers.dev/__test_0720';
      const testStart=Date.UTC(2026,9,21,22,20); // 2026-10-22 07:20 JST
      const testEnd=Date.UTC(2026,9,21,22,25);     // 2026-10-22 07:25 JST
      const state=n=>!(n>=testStart&&n<testEnd);
      let last=state(Date.now());
      frame.addEventListener('load',()=>document.getElementById('loading')?.remove());
      setInterval(()=>{
        const now=Date.now(),current=state(now);
        if(current!==last){
          last=current;
          const loading=document.getElementById('loading');
          if(loading)loading.style.display='grid';
          frame.src=base+'?boundary='+now;
        }
      },250);
    })();
  </script>
</body>
</html>
