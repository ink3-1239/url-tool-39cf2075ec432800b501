<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <title>科学技術部のゲーム案内所</title>
  <style>
    html,body,iframe{width:100%;height:100%;margin:0;border:0;display:block;background:#050813}
    html,body{overflow:hidden}
    #loading{position:fixed;inset:0;display:grid;place-items:center;color:#efe8da;background:#050813;font:900 13px ui-monospace,monospace;letter-spacing:.18em}
  </style>
</head>
<body>
  <div id="loading">NOW LOADING</div>
  <iframe
    id="event"
    title="科学技術部のゲーム案内所"
    src="https://knj48-iframetester.onrender.com/?url=https%3A%2F%2Fscience-club-event-private.ink3-tomo-0827.workers.dev%2Fa7f3c91e2b"
    allow="fullscreen; autoplay; gamepad; clipboard-read; clipboard-write"
    allowfullscreen
  ></iframe>
  <script>
    (()=>{
      const frame=document.getElementById('event');
      const base='https://knj48-iframetester.onrender.com/?url=https%3A%2F%2Fscience-club-event-private.ink3-tomo-0827.workers.dev%2Fa7f3c91e2b';
      const windows=[
        [Date.UTC(2026,9,22,3,40),Date.UTC(2026,9,22,4,10)],
        [Date.UTC(2026,9,23,3,40),Date.UTC(2026,9,23,4,10)],
        [Date.UTC(2026,9,26,3,40),Date.UTC(2026,9,26,4,10)],
        [Date.UTC(2026,9,27,3,40),Date.UTC(2026,9,27,4,10)],
        [Date.UTC(2026,9,28,3,40),Date.UTC(2026,9,28,4,10)],
        [Date.UTC(2026,9,29,3,40),Date.UTC(2026,9,29,4,10)]
      ];
      const state=n=>n<windows[0][0]||windows.some(w=>n>=w[0]&&n<w[1]);
      let last=state(Date.now());
      frame.addEventListener('load',()=>document.getElementById('loading')?.remove());
      setInterval(()=>{
        const now=Date.now(),current=state(now);
        if(current!==last){
          last=current;
          const loading=document.getElementById('loading');
          if(loading)loading.style.display='grid';
          frame.src=base+'&boundary='+now;
        }
      },250);
    })();
  </script>
</body>
</html>
