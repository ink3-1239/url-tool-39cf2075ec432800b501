<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>科学技術部のゲーム案内所</title><style>html,body,#frame{margin:0;width:100%;height:100%;border:0;display:block;background:#050813;overflow:hidden}#load{position:fixed;inset:0;display:grid;place-items:center;background:#050813;color:#efe8da;font:900 13px ui-monospace;letter-spacing:.18em}</style></head><body><div id="load">NOW LOADING</div><iframe id="frame" title="科学技術部のゲーム案内所" allow="fullscreen; autoplay; gamepad" allowfullscreen></iframe><script>(()=>{
  const t = "e9bb6ffa3b87364662c.html";
  const f = document.getElementById('frame');
  const PREFIX = "/url-tool-39cf2075ec432800b501/";

  function install(win){
    try{
      if(!win || win.__tcSameFrameOpen) return;
      win.__tcSameFrameOpen = 1;
      const doc = win.document;
      function norm(u){
        try{
          if(!u) return null;
          const s = String(u).trim();
          if(/^(javascript:|mailto:|#)/i.test(s)) return null;
          const a = doc.createElement("a");
          a.href = s;
          if(a.host && a.host !== win.location.host) return null;
          let p = a.pathname || "";
          const i = p.indexOf(PREFIX);
          if(i >= 0) p = p.slice(i + PREFIX.length);
          p = p.replace(/^\/+/, "").replace(/\?v=\d+/g, "");
          if(!/\.html$/i.test(p)) return null;
          return p;
        }catch(e){ return null; }
      }
      const open0 = win.open;
      win.open = function(u){
        let x = norm(u);
        if(x){
          if(/^staff-roll\.html(\?|$)/i.test(x)) x += (x.indexOf('?')>=0?'&':'?') + 'fresh=' + Date.now();
          win.location.href = x; return win;
        }
        try{ return open0.apply(win, arguments); }catch(e){ return null; }
      };
      doc.addEventListener("click", function(e){
        let el = e.target;
        while(el && el.tagName !== "A") el = el.parentNode;
        if(!el || !el.getAttribute) return;
        let x = norm(el.getAttribute("href"));
        if(!x) return;
        if(/^staff-roll\.html(\?|$)/i.test(x)) x += (x.indexOf('?')>=0?'&':'?') + 'fresh=' + Date.now();
        e.preventDefault();
        e.stopPropagation();
        win.location.href = x;
      }, true);
      const strip = () => {
        const list = doc.querySelectorAll('a[target="_blank"]');
        for(let i=0;i<list.length;i++) list[i].removeAttribute("target");
      };
      strip();
      setInterval(strip, 1500);

      // スタッフロールだけ、案内所から開くときに古い控えを掴まないようにする。
      // ほかのゲームの住所には何も足さない。
      const srSeen = new Set();
      const bustStaffRoll = () => {
        try{
          const list = doc.querySelectorAll('iframe');
          for(let i=0;i<list.length;i++){
            const el = list[i];
            const src = el.getAttribute('src') || el.src || "";
            if(!src) continue;
            if(!/staff-roll\.html(\?|#|$)/i.test(src)) continue;
            if(/[?&]fresh=/.test(src)) continue;
            if(srSeen.has(src)) continue;
            srSeen.add(src);
            const sep = src.indexOf('?') >= 0 ? '&' : '?';
            const next = src + sep + 'fresh=' + Date.now();
            srSeen.add(next);
            el.setAttribute('src', next);
          }
        }catch(e){}
      };
      bustStaffRoll();
      setInterval(bustStaffRoll, 250);

      // 時間制限版が混ざっていても、部員用では常に開く
      const ungate = () => {
        try{
          const st = doc.getElementById('eventTimeGateStyle');
          if(st) st.remove();
          const ov = doc.getElementById('eventTimeClosed');
          if(ov) ov.remove();
          doc.documentElement.classList.remove('event-time-closed');
        }catch(e){}
      };
      ungate();
      setInterval(ungate, 200);

      // EVENT PASSWORD の入力だけを飛ばす。オープニングの演出は残し、STARTから始める。
      const openIntro = () => {
        try{
          const wrap = doc.getElementById('tcPassWrap');
          const unlock = doc.getElementById('tcUnlock');
          const start = doc.getElementById('tcStart');
          const prompt = doc.getElementById('tcIntroPrompt');
          const input = doc.getElementById('tcPassword');
          if(!start) return;
          if(wrap){ wrap.hidden = true; wrap.style.display = 'none'; }
          if(unlock){ unlock.hidden = true; unlock.style.display = 'none'; }
          if(input){ input.disabled = true; }
          if(prompt && prompt.dataset.tcDone !== '1'){
            prompt.innerHTML = 'ゲームの世界へ、準備はいい？<br>STARTを押してね。';
            prompt.dataset.tcDone = '1';
          }
          start.hidden = false;
          start.classList.add('tc-ready');
        }catch(e){}
      };
      openIntro();
      const oi = setInterval(openIntro, 200);
      setTimeout(() => clearInterval(oi), 20000);

      // 本体は「合言葉が通ったか」を内部で覚えている。
      // 照合の計算結果を一度だけ正解にすり替えて通し、すぐ元に戻す。
      (function authIntro(){
        try{
          const HEX = 'ecda78d215d53d6a4375fadf3b3e286081c332db1731cb648c8e4ccc95d031cc';
          const bytes = new Uint8Array(32);
          for(let i=0;i<32;i++) bytes[i] = parseInt(HEX.substr(i*2,2),16);
          const sub = win.crypto && win.crypto.subtle;
          const unlock = doc.getElementById('tcUnlock');
          const input = doc.getElementById('tcPassword');
          const start = doc.getElementById('tcStart');
          if(!sub || !unlock || !input || !start) return;
          const orig = sub.digest.bind(sub);
          sub.digest = function(){ return Promise.resolve(bytes.buffer.slice(0)); };
          input.disabled = false;
          input.value = 'x';
          unlock.hidden = false;
          unlock.disabled = false;
          unlock.click();
          setTimeout(() => {
            try{ sub.digest = orig; }catch(e){}
            // 合言葉が通らなかったときは、オープニングごと取り除いて確実に開けるようにする
            try{
              const p = doc.getElementById('tcIntroPrompt');
              const ok = p && p.textContent.indexOf('準備完了') >= 0;
              if(!ok){
                const intro = doc.getElementById('tcEventIntro');
                if(intro){ intro.hidden = true; intro.remove(); }
                doc.body && doc.body.classList.remove('tc-intro-lock');
                return;
              }
            }catch(e){}
            try{
              input.value = '';
              input.disabled = true;
              unlock.hidden = true;
              unlock.style.display = 'none';
              const wrap = doc.getElementById('tcPassWrap');
              if(wrap){ wrap.hidden = true; wrap.style.display = 'none'; }
              start.hidden = false;
              start.classList.add('tc-ready');
            }catch(e){}
          }, 400);
        }catch(e){}
      })();
    }catch(e){}
  }

  // 保存されている一覧の住所を絶対URLに整える。
  // 相対表記のままだと、手作りのサムネを探す処理が失敗して自動生成の絵になる。
  const BASE = "https://ink3-1239.github.io/url-tool-39cf2075ec432800b501/";
  function fixCatalogUrls(){
    try{
      const K = 'gesen-dev-custom-v1';
      const raw = localStorage.getItem(K);
      if(!raw) return;
      let a = JSON.parse(raw);
      if(!Array.isArray(a)) return;
      let changed = false;
      for(const e of a){
        if(!e || typeof e.url !== "string") continue;
        const u = e.url.trim();
        if(/^https?:\/\//i.test(u)) continue;
        if(!/\.html$/i.test(u)) continue;
        e.url = BASE + u.replace(/^\/+/, "");
        changed = true;
      }
      if(changed) localStorage.setItem(K, JSON.stringify(a));
    }catch(e){}
  }
  fixCatalogUrls();
  setInterval(fixCatalogUrls, 1000);

  // テスターの中では保存領域が別枠になり、一覧の控えが空になる。
  // 足りない分だけ公式の一覧から取り寄せて置く。既存の項目には触らない。
  const CATALOG_URL = "https://raw.githubusercontent.com/ink3-1239/game-portal-data/main/catalog.json";
  async function seedCatalog(){
    try{
      const K = 'gesen-dev-custom-v1';
      let have = [];
      try{ have = JSON.parse(localStorage.getItem(K) || '[]'); }catch(e){ have = []; }
      if(!Array.isArray(have)) have = [];
      const r = await fetch(CATALOG_URL, { cache: 'no-store' });
      if(!r.ok) return;
      const j = await r.json();
      const list = Array.isArray(j.customs) ? j.customs : [];
      if(!list.length) return;
      const ids = new Set(have.map(e => e && e.id));
      const titles = new Set(have.map(e => e && e.title));
      let added = 0;
      for(const e of list){
        if(!e || !e.url) continue;
        if(ids.has(e.id) || titles.has(e.title)) continue;
        const c = Object.assign({}, e);
        if(!/^https?:\/\//i.test(c.url)) c.url = BASE + String(c.url).replace(/^\/+/, "");
        have.push(c);
        added++;
      }
      if(added) localStorage.setItem(K, JSON.stringify(have));
    }catch(e){}
  }

  // 最初のパスワード画面を飛ばす。部員用なので入力を求めない。
  function openGate(){
    try{
      const tok = (function(){
        try{
          const b = new Uint8Array(24);
          crypto.getRandomValues(b);
          return Array.from(b, x => x.toString(16).padStart(2,"0")).join("");
        }catch(e){
          return (Math.random().toString(16).slice(2) + Math.random().toString(16).slice(2) + Date.now().toString(16));
        }
      })();
      const rec = JSON.stringify({ token: tok, expiresAt: Date.now() + 1800*1000 });
      sessionStorage.setItem('gesen-dev-session-v1', rec);
      sessionStorage.setItem('gesen-club-session-v1', rec);
    }catch(e){}
  }
  openGate();
  setInterval(openGate, 60*1000);

  f.onload = () => {
    document.getElementById('load')?.remove();
    install(f.contentWindow);
  };
  Promise.race([seedCatalog(), new Promise(r => setTimeout(r, 2500))]).then(() => { fixCatalogUrls(); f.src = t; });
})();</script></body></html>
