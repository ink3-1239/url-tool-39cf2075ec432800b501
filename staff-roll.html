<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>スタッフロール</title>
<style>
  html, body { margin:0; padding:0; height:100%; background:#000; overflow:hidden; }
  body {
    font-family:"Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic","Meiryo",sans-serif;
    color:#f2f2f2; -webkit-font-smoothing:antialiased;
  }
  #stage { position:fixed; inset:0; overflow:hidden; cursor:pointer; }
  #roll {
    position:absolute; top:0; left:0; width:100%; box-sizing:border-box;
    padding:0 20px; text-align:center; letter-spacing:.06em; line-height:1.65;
    transition:transform .35s ease;
  }
  body.waiting #roll, body.waiting #chal, body.waiting #allclear, body.waiting #sr-demo { visibility:hidden; }
  #roll.flowing {
    transition:none;
    animation-name:rollUp; animation-timing-function:linear;
    animation-fill-mode:forwards; animation-play-state:running;
  }
  @keyframes rollUp { from { transform:translateY(100vh); } to { transform:translateY(-100%); } }
  .base { font-size:17px; }
  .b { font-size:22px; font-weight:700; color:#ffffff; }
  .s { font-size:15px; color:#d6d6d6; margin-top:.3em; }
  .v { font-size:28px; font-weight:700; color:#ffffff; }
  .no {
    display:inline-block; border:2px solid #ffffff; border-radius:.32em;
    padding:0 .32em; margin-right:.5em; font-size:.78em; line-height:1.45;
    vertical-align:.12em; letter-spacing:.02em;
  }
  .gap-note { height:9em; }
  .gap-sect { height:3.2em; }
  .gap-v { height:1.6em; }
  .station {
    display:flex; gap:18px; align-items:center; justify-content:center;
    margin-bottom:5em;
  }
  .station canvas {
    border:2px solid #3a3a3a; border-radius:10px; background:#060606;
    touch-action:none; flex:0 0 auto; transition:border-color .3s, box-shadow .3s;
  }
  .station.focused canvas { border-color:#ffd76a; box-shadow:0 0 14px rgba(255,215,106,.35); }
  .station .meta { text-align:left; }
  .gstat { font-size:12px; color:#8f9a9a; margin-top:.55em; letter-spacing:.1em; }
  .ghelp { font-size:11px; color:#7f9f8f; margin-top:.4em; letter-spacing:.04em; max-width:32em; }
  .station.cleared canvas { border-color:#3fe081; box-shadow:0 0 16px rgba(63,224,129,.5); }
  .station.cleared .gstat { color:#3fe081; font-weight:700; }
  #roll.gold .b, #roll.gold .v { color:#ffd76a; }
  #roll.gold .no { border-color:#ffd76a; color:#ffd76a; }
  #chal {
    position:fixed; top:8px; right:12px; text-align:right;
    font-size:11px; color:#ffd76a; letter-spacing:.06em; pointer-events:none;
  }
  #chal.done { color:#3fe081; font-weight:700; }
  #allclear {
    position:fixed; top:38%; left:0; width:100%; text-align:center;
    color:#3fe081; font-size:34px; font-weight:800; letter-spacing:.2em;
    text-shadow:0 0 18px rgba(63,224,129,.65); display:none; pointer-events:none;
  }
  #allclear small { display:block; font-size:13px; font-weight:400; color:#bfe8cd; letter-spacing:.12em; margin-top:10px; }
  #allclear.fail { color:#ff5566; text-shadow:0 0 18px rgba(255,85,102,.6); }
  #allclear.fail small { color:#e8bfc4; }
  #fx { position:fixed; inset:0; pointer-events:none; }
  body.plain #chal { display:none; }
  body.plain #sr-demo { display:none; }
  body.plain .station canvas { display:none; }
  body.plain .gstat, body.plain .ghelp { display:none; }
  body.plain .station .meta { text-align:center; }
</style>
</head>
<body class="plain">
<div id="stage">
  <div id="roll">
    <div class="base">情報漏洩の可能性があるためハンドルネームで紹介します。</div>
    <div class="gap-note"></div>
    <div class="b">科学技術部のゲーム案内所制作</div>
    <div class="s">ink3</div>
    <div class="s">arenaAI(サイト)</div>
    <div class="s">GitHub(サイト)</div>
    <div class="gap-sect"></div>
    <div class="v">ゲーム制作</div>
    <div class="gap-v"></div>
    <div id="stations"></div>
  </div>
</div>
<div id="chal"></div>
<div id="allclear"></div>
<canvas id="fx"></canvas>
<script>
(function () {
  "use strict";
  var FLOW_SEC = 200, PREP_SEC = 0;
  var DEMO = /[?&]sr_demo=1/.test(location.search);
  var META = [
    ["1", "クラフト＆バスターズ", "ink3"],
    ["2", "フローズン・ダジャレ", "ink3"],
    ["3", "バーガー帝国", "ink3"],
    ["4", "3 in 1 ARCADE", "ink3"],
    ["5", "ロイヤル・リッチ・カジノ", "ink3"],
    ["6", "SALTLINE", "BIGSHOT"],
    ["7", "Kaizo Knight", "BIGSHOT"],
    ["8", "立体機動｜SKY RECON", "KNJ48"],
    ["9", "ホワイトファクトリー", "MO"],
    ["10", "MOINCRAFT", "MO"],
    ["11", "CONNECT FURY", "MO"],
    ["12", "ドールビーム", "MO"],
    ["13", "オセロ・アリーナ", "MO"]
  ];
  var HELP = [
    "迫るスライムをタップで撃つ(10体)。弾は6発まで、oreブロック(緑)を撃つと+3。弾0でタップor基地到達=やり直し",
    "クリック長押し=ライター。白い針を緑の帯に入れ続けて氷を溶かす。帯を外れるとやり直し",
    "揺れるバーガーを塔の真上へ落下。±3px以内の一発勝負",
    "出現するモグラ6匹の順番を覚えて、同じ順番でタップ(記憶)",
    "ブラックジャック! HITで引く/STANDで決着。21超えorディーラーに勝てなければやり直し(引き分けも負け)",
    "長押し=巻く/離す=緩める。テンションを保って糸を切る前に魚を寄せる(制御)",
    "赤ハートをドラッグで動かす。本家最初の攻撃SLASH:予告線が点滅→太くなったら線沿いに斬撃! 10秒生存、斬られたらやり直し",
    "赤丸はカーソル関係なくランダムに動く。真上でタップ3回(外してもリセットなし)",
    "2つの切替をタップで設定しベルトを分岐。4つの品物を同色スロットへ全納入(計画)",
    "マスをタップで光らせて上のお手本に合わせる(再タップで消灯)。レシピは毎回5種からランダム",
    "列をタップでディスクを落とす。妨害AIより先に四連を1勝",
    "ドラッグ移動+長押しチャージ、離すとビーム弾発射! 先に3回当てて(相手の弾は回避)。本家の2D版",
    "6×6オセロでAIと一戦。AIより多く石を取ればクリア(引き分けもやり直し)。光る点=置ける場所"
  ];
  var roll = document.getElementById("roll");
  var stage = document.getElementById("stage");
  var banner = document.getElementById("allclear");
  var chal = document.getElementById("chal");
  var fx = document.getElementById("fx");
  var fxc = fx.getContext("2d");
  var wrap = document.getElementById("stations");
  var flowing = false, ended = false, failed = false, focused = 0, allclear = false;
  var plain = true, seqIdx = 0;
  var KEYSEQ = ["ArrowUp", "ArrowUp", "ArrowDown", "ArrowDown", "ArrowLeft", "ArrowRight", "ArrowLeft", "ArrowRight", "b", "a"];
  var prepEnd = 0, flowStart = 0, lastSec = -1;
  var games = [], stations = [];

  META.forEach(function (m, i) {
    var d = document.createElement("div");
    d.className = "station";
    d.innerHTML = '<canvas width="150" height="150"></canvas>' +
      '<div class="meta"><div class="b"><span class="no">' + m[0] + "</span>" + m[1] + "</div>" +
      '<div class="s">' + m[2] + "</div>" +
      '<div class="s">arenaAI</div>' +
      '<div class="gstat"></div>' +
      '<div class="ghelp">' + HELP[i] + "</div></div>";
    wrap.appendChild(d);
    stations.push(d);
  });

  function stat(i, txt) { stations[i].querySelector(".gstat").textContent = txt; }
  function clearedCount() { return games.filter(function (g) { return g.cleared; }).length; }
  function chalUpdate() {
    var n = clearedCount(), tot = games.length;
    chal.className = n >= tot ? "done" : "";
    chal.textContent = "クリア " + n + "/" + tot;
    if (demoBtn) demoBtn.style.right = (chal.offsetWidth + 20) + "px";
  }
  function clearGame(i) {
    games[i].cleared = true;
    games[i].flash = 1.5;
    stations[i].classList.add("cleared");
    stat(i, "CLEAR ✓");
    chalUpdate();
    drawFramed(i);
    if (!allclear && clearedCount() >= games.length) payoff();
    else autoNext(i);
  }
  function autoNext(i) {
    if (DEMO) return;
    for (var k = 1; k <= games.length; k++) {
      var j = (i + k) % games.length;
      if (!games[j].cleared) { focus(j); return; }
    }
  }
  function resetGame(i) {
    games[i].reset();
    games[i].flash = 0;
    stat(i, games[i].label());
    drawFramed(i);
  }

  var parts = [], fxUntil = 0;
  function payoff() {
    allclear = true;
    window.STAFF_ROLL_ALLCLEAR = true;
    if (DEMO) return;
    roll.classList.add("gold");
    banner.className = "";
    banner.innerHTML = "★ ALL CLEAR ★<small>何かは案内所とくっつけた時に解禁…!</small>";
    banner.style.display = "block";
    try {
      var cu = (localStorage.getItem("gesen_sr_clear_url") || "").trim();
      if (cu && !document.getElementById("sr-perk")) {
        var pk = document.createElement("div");
        pk.id = "sr-perk";
        pk.textContent = "☆クリア特典☆ここをタップ";
        pk.style.cssText = "position:fixed;top:10px;left:50%;transform:translateX(-50%);z-index:95;background:#ffd400;color:#14120e;border:2px solid #14120e;border-radius:8px;padding:8px 16px;font:900 14px/1.4 sans-serif;letter-spacing:.08em;cursor:pointer;box-shadow:3px 3px 0 rgba(255,255,255,.85);";
        pk.addEventListener("click", function () {
          var u = "";
          try { u = (localStorage.getItem("gesen_sr_clear_url") || "").trim(); } catch (e2) {}
          if (u) window.open(u, "_blank", "noopener");
        });
        document.body.appendChild(pk);
      }
    } catch (e) {}
    fx.width = innerWidth; fx.height = innerHeight;
    parts = [];
    for (var i = 0; i < 140; i++) parts.push({
      x: Math.random() * innerWidth, y: -20 - Math.random() * innerHeight * .5,
      v: 120 + Math.random() * 220, r: 2 + Math.random() * 4,
      c: ["#3fe081", "#ffd76a", "#ff7a45", "#ffffff"][i % 4]
    });
    fxUntil = performance.now() + 3200;
    setTimeout(function () { banner.style.display = "none"; }, 4200);
  }
  function failOut() {
    failed = true; ended = true;
    banner.className = "fail";
    banner.innerHTML = "TIME UP<small>最後まで流れ切った…4秒後に自動で再挑戦</small>";
    banner.style.display = "block";
    chalUpdate();
    setTimeout(function () { location.reload(); }, 4000);
  }

  function ctxOf(i) { return stations[i].querySelector("canvas").getContext("2d"); }
  function base(i) {
    return { i: i, cleared: false, flash: 0, t: 0, update: function (dt) { this.t += dt; }, down: function () {}, up: function () {}, move: function () {} };
  }
  function cls(c) { c.clearRect(0, 0, 150, 150); }

  /* 1 craft & busters: shoot slimes, mine ore for ammo */
  function g1(i) {
    var g = base(i), foes = [], ore = null, oreT = 3, spn = 1, ammo = 6, kills = 0, spd = 26;
    g.reset = function () { foes = []; ore = null; oreT = 3; spn = 1; ammo = 6; kills = 0; spd = 26; };
    g.label = function () { return "KILL " + kills + "/10  AMMO " + ammo; };
    g.update = function (dt) {
      g.t += dt; spn -= dt; oreT -= dt;
      if (spn <= 0) {
        var e = Math.floor(Math.random() * 4), x, y;
        if (e === 0) { x = -8; y = 20 + Math.random() * 110; } else if (e === 1) { x = 158; y = 20 + Math.random() * 110; }
        else if (e === 2) { x = Math.random() * 150; y = -8; } else { x = Math.random() * 150; y = 158; }
        foes.push({ x: x, y: y });
        spn = Math.max(.5, 1.6 - kills * .09);
      }
      if (!ore && oreT <= 0) { ore = { x: 25 + Math.random() * 100, y: 25 + Math.random() * 100, life: 2.2 }; oreT = 4 + Math.random() * 3; }
      if (ore) { ore.life -= dt; if (ore.life <= 0) ore = null; }
      for (var n = foes.length - 1; n >= 0; n--) {
        var f = foes[n], d = Math.atan2(75 - f.y, 75 - f.x);
        f.x += Math.cos(d) * spd * dt; f.y += Math.sin(d) * spd * dt;
        if (Math.hypot(75 - f.x, 75 - f.y) < 12) { resetGame(i); return; }
      }
      stat(i, g.label());
    };
    g.down = function (x, y) {
      if (ore && Math.hypot(ore.x - x, ore.y - y) < 14) { ammo = Math.min(9, ammo + 3); ore = null; g.flash = 1; stat(i, g.label()); return; }
      if (ammo <= 0) { resetGame(i); return; }
      ammo--;
      var hit = false;
      for (var n = foes.length - 1; n >= 0; n--) {
        if (Math.hypot(foes[n].x - x, foes[n].y - y) < 13) { foes.splice(n, 1); kills++; spd += 2; hit = true; break; }
      }
      if (kills >= 10) clearGame(i); else { g.flash = hit ? 1 : 0; stat(i, g.label()); }
    };
    g.draw = function (c) {
      cls(c);
      c.fillStyle = "#12241a"; c.fillRect(0, 0, 150, 150);
      c.fillStyle = "#ff4d5e";
      c.beginPath(); c.moveTo(75, 81); c.bezierCurveTo(66, 71, 71, 66, 75, 72); c.bezierCurveTo(79, 66, 84, 71, 75, 81); c.fill();
      if (ore) { c.fillStyle = "#2a6b57"; c.fillRect(ore.x - 10, ore.y - 10, 20, 20); c.fillStyle = "#7fd8c8"; c.fillRect(ore.x - 4, ore.y - 4, 8, 8); }
      foes.forEach(function (f) {
        c.fillStyle = "#5ad06e"; c.beginPath(); c.arc(f.x, f.y, 10, Math.PI, 0); c.lineTo(f.x + 10, f.y + 6); c.lineTo(f.x - 10, f.y + 6); c.fill();
        c.fillStyle = "#06220c"; c.beginPath(); c.arc(f.x - 3, f.y - 2, 2, 0, 7); c.arc(f.x + 3, f.y - 2, 2, 0, 7); c.fill();
      });
      c.fillStyle = "#ffd76a";
      for (var n = 0; n < ammo; n++) c.fillRect(8 + n * 9, 136, 5, 9);
    };
    g.ai = function (dt) {
      g.aiT = (g.aiT || 0) + dt;
      if (g.aiT < .3) return;
      g.aiT = 0;
      if (ammo <= 2 && ore) { demoClick(i, ore.x, ore.y); g.down(ore.x, ore.y); return; }
      if (foes.length) {
        var best = foes[0], bd2 = 1e9;
        foes.forEach(function (f) { var d = Math.hypot(f.x - 75, f.y - 75); if (d < bd2) { bd2 = d; best = f; } });
        demoClick(i, best.x, best.y);
        g.down(best.x, best.y);
      }
    };
    return g;
  }

  /* 2 frozen dajare: needle in the band */
  function g2(i) {
    var g = base(i), v = .55, melt = 0, out = 0;
    g.keyHold = false;
    g.reset = function () { v = .55; melt = 0; out = 0; g.keyHold = false; g.t = 0; };
    g.label = function () { return "MELT " + Math.floor(melt / 4 * 100) + "%"; };
    g.update = function (dt) {
      g.t += dt;
      var hold = g.keyHold;
      v += (hold ? .6 : -.4) * dt;
      v = Math.max(0, Math.min(1, v));
      var mid = .55 + Math.sin(g.t * 1.3) * .08;
      if (v > mid - .1 && v < mid + .1) {
        out = Math.max(0, out - dt * 1.5); melt += dt; g.flash = .6;
        if (melt >= 4) { clearGame(i); return; }
        stat(i, g.label());
      } else { out += dt; if (out > .6) { resetGame(i); return; } }
    };
    g.down = function () {};
    g.up = function () {};
    g.draw = function (c) {
      cls(c);
      var s = 1 - melt / 4;
      c.fillStyle = "#bfe8ee"; c.fillRect(95, 110 - 70 * s, 40, 70 * s);
      c.fillStyle = "#ff7a45";
      c.beginPath(); c.moveTo(30, 118); c.quadraticCurveTo(22, 96 - v * 30, 30, 84 - v * 26); c.quadraticCurveTo(38, 96 - v * 30, 30, 118); c.fill();
      c.fillStyle = "#444"; c.fillRect(24, 118, 12, 22);
      c.fillStyle = "#222"; c.fillRect(10, 10, 14, 130);
      var mid = .55 + Math.sin(g.t * 1.3) * .08;
      c.fillStyle = "#1d5a43"; c.fillRect(12, 10 + (1 - (mid + .1)) * 130, 10, .2 * 130);
      c.fillStyle = "#fff"; c.fillRect(10, 10 + (1 - v) * 130 - 2, 14, 3);
      c.fillStyle = "#8f9a9a"; c.font = "10px sans-serif"; c.fillText("HOLD", 96, 16);
    };
    g.ai = function (dt) {
      var mid = .55 + Math.sin(g.t * 1.3) * .08;
      var ph = g.keyHold;
      if (v < mid - .04) g.keyHold = true;
      else if (v > mid + .04) g.keyHold = false;
      if (ph !== g.keyHold) demoHold(i, 30, 100, g.keyHold);
    };
    return g;
  }

  /* 3 burger empire: one perfect drop */
  function g3(i) {
    var g = base(i), fall = null;
    g.reset = function () { fall = null; g.t = 0; };
    g.label = function () { return "±4px DROP"; };
    g.cur = function () { return 75 + Math.sin(g.t * 4) * 55; };
    g.update = function (dt) {
      g.t += dt;
      if (fall) {
        fall.vy += 560 * dt; fall.y += fall.vy * dt;
        if (fall.y >= 90) { if (Math.abs(fall.x - 75) <= 3) clearGame(i); else resetGame(i); }
      }
    };
    g.down = function () { if (!fall) fall = { x: g.cur(), y: 20, vy: 0 }; };
    g.draw = function (c) {
      cls(c);
      for (var n = 0; n < 4; n++) {
        var y = 138 - n * 12;
        c.fillStyle = n % 2 ? "#8a5a33" : "#d8b48a"; c.fillRect(49, y, 52, 10);
        c.fillStyle = "#ff7a45"; c.fillRect(49, y + 8, 52, 3);
      }
      c.strokeStyle = "#ffd76a"; c.lineWidth = 1.5;
      c.beginPath(); c.moveTo(71, 70); c.lineTo(71, 96); c.moveTo(79, 70); c.lineTo(79, 96); c.stroke();
      if (!g.cleared) {
        var x = fall ? fall.x : g.cur(), y = fall ? fall.y : 20;
        c.fillStyle = "#ffd76a"; c.fillRect(x - 26, y, 52, 10);
        c.fillStyle = "#ff7a45"; c.fillRect(x - 26, y + 8, 52, 3);
      }
    };
    g.ai = function (dt) { if (!fall && Math.abs(g.cur() - 75) <= 2) { demoClick(i, g.cur(), 20); g.down(); } };
    return g;
  }

  /* 4 3in1 mole: simon memory */
  function g4(i) {
    var g = base(i), seq = [], phase = "show", idx = 0, up = -1, tm = 0, input = 0;
    g.reset = function () {
      seq = [];
      for (var n = 0; n < 6; n++) seq.push(Math.floor(Math.random() * 4));
      phase = "show"; idx = 0; up = -1; tm = .7; input = 0;
    };
    g.label = function () { return phase === "show" ? "MEMORIZE" : "RECALL " + input + "/6"; };
    g.pos = function (n) { return { x: 45 + (n % 2) * 60, y: 60 + Math.floor(n / 2) * 50 }; };
    g.update = function (dt) {
      g.t += dt;
      if (phase !== "show") { stat(i, g.label()); return; }
      tm -= dt;
      if (tm <= 0) {
        if (up >= 0) { up = -1; tm = .22; }
        else if (idx < 6) { up = seq[idx]; idx++; tm = .5; }
        else phase = "input";
      }
    };
    g.down = function (x, y) {
      if (phase !== "input") { resetGame(i); return; }
      for (var n = 0; n < 4; n++) {
        var p = g.pos(n);
        if (Math.abs(x - p.x) < 26 && Math.abs(y - p.y) < 24) {
          if (n === seq[input]) { input++; g.flash = 1; if (input >= 6) clearGame(i); else stat(i, g.label()); }
          else resetGame(i);
          return;
        }
      }
      resetGame(i);
    };
    g.draw = function (c) {
      cls(c);
      for (var n = 0; n < 4; n++) {
        var p = g.pos(n);
        c.fillStyle = "#101c1a"; c.beginPath(); c.ellipse(p.x, p.y + 10, 22, 9, 0, 0, 7); c.fill();
        if (up === n) { c.fillStyle = "#a9744f"; c.beginPath(); c.arc(p.x, p.y, 14, 0, 7); c.fill(); c.fillStyle = "#000"; c.beginPath(); c.arc(p.x - 4, p.y - 3, 2, 0, 7); c.arc(p.x + 4, p.y - 3, 2, 0, 7); c.fill(); }
      }
      c.fillStyle = "#8f9a9a";
      for (n = 0; n < 6; n++) { c.beginPath(); c.arc(45 + n * 12, 140, 3, 0, 7); c.fill(); }
    };
    g.ai = function (dt) {
      if (phase !== "input") return;
      g.aiT = (g.aiT || 0) + dt;
      if (g.aiT < .4) return;
      g.aiT = 0;
      var p = g.pos(seq[input]);
      g.down(p.x, p.y);
    };
    return g;
  }

  /* 5 casino: blackjack */
  function g5(i) {
    var SUIT = ["\u2660", "\u2665", "\u2666", "\u2663"];
    var g = base(i), P = [], D = [], phase = "play", tm = 0, dT = 0, msg = "";

      parts.forEach(function (p) {
        p.y += p.v * dt;
        fxc.fillStyle = p.c;
        fxc.fillRect(p.x, p.y, p.r, p.r);
      });
    } else if (parts.length) { parts = []; fxc.clearRect(0, 0, fx.width, fx.height); }
    requestAnimationFrame(loop);
  }
  fx.width = innerWidth; fx.height = innerHeight;
  games.forEach(function (g, i) { drawFramed(i); });
  prepEnd = performance.now() + PREP_SEC * 1000;
  chalUpdate();
  if (DEMO) { plain = false; document.body.classList.remove("plain"); }
  focus(0);
  if (!waitTap && !DEMO) startFlow();
  requestAnimationFrame(loop);
})();
</script>
