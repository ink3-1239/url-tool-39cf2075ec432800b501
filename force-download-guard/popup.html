<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<title>強制ダウンロード ガード</title>
<!-- CSS は埋め込み（この HTML 1 ファイルだけダウンロードしても同じ見た目になります） -->
<style>
/* FDG:CSS:BEGIN */
/* --- popup.css --- */
:root{
  --bg:#f4f5f7; --card:#fff; --text:#1c1f23; --muted:#767d87;
  --line:#e6e8ec; --accent:#2563eb; --danger:#c02626; --ok:#15803d;
}
@media (prefers-color-scheme:dark){
  :root{ --bg:#15171b; --card:#1e2127; --text:#e9ebee; --muted:#98a0aa;
         --line:#31353d; --accent:#6ea8fe; --danger:#f0736f; --ok:#5fd08a; }
}
*{box-sizing:border-box}
body{
  width:380px; margin:0; background:var(--bg); color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Hiragino Sans","Noto Sans JP",sans-serif;
  font-size:13px; line-height:1.6;
}

/* ヘッダー */
.head{display:flex; align-items:center; gap:9px; padding:13px 15px; background:var(--card); border-bottom:1px solid var(--line)}
.head-icon{font-size:20px; line-height:1}
.head-text{flex:1 1 auto; min-width:0}
.head h1{margin:0; font-size:14px; font-weight:700}
.head p{margin:1px 0 0; font-size:11.5px; color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.head p.on{color:var(--ok)}
.pill{flex:0 0 auto; font-size:11px; font-weight:700; padding:2px 9px; border-radius:999px; background:rgba(127,127,127,.16); color:var(--muted)}
.pill.on{background:rgba(21,128,61,.15); color:var(--ok)}
.pill.off{background:rgba(192,38,38,.12); color:var(--danger)}

main{padding:11px; display:flex; flex-direction:column; gap:10px}
section{background:var(--card); border:1px solid var(--line); border-radius:12px; padding:12px 13px}
h3{margin:0 0 9px; font-size:12px; font-weight:700; color:var(--muted)}
h3 .count{display:inline-block; min-width:17px; padding:0 5px; border-radius:9px; background:var(--accent); color:#fff; font-size:10.5px; text-align:center; margin-left:4px}

/* いま開いているサイト */
.hero{border-color:var(--accent)}
.hero-host{font-size:15px; font-weight:700; word-break:break-all; margin-bottom:8px}
.btn{appearance:none; border:1px solid var(--accent); background:var(--accent); color:#fff; border-radius:9px; padding:8px 12px; font-size:12.5px; font-weight:600; cursor:pointer}
.btn.ghost{background:transparent; color:var(--accent)}
.btn:hover{filter:brightness(1.07)}
.btn.big{width:100%; padding:12px; font-size:14px}
.btn:disabled{opacity:.55; cursor:default}
label.check{display:flex; gap:7px; align-items:flex-start; margin-top:9px; font-size:11.5px; color:var(--muted); cursor:pointer}
label.check input{margin-top:3px; accent-color:var(--accent)}
.status{margin:9px 0 0; padding:7px 9px; border-radius:8px; font-size:11.5px; background:rgba(127,127,127,.1)}
.status.ok{background:rgba(21,128,61,.13); color:var(--ok)}
.status.warn{background:rgba(180,83,9,.13); color:#b45309}
.status.error{background:rgba(192,38,38,.1); color:var(--danger)}

/* テスト */
#test-frame{width:100%; height:168px; border:1px solid var(--line); border-radius:9px; background:#fff; display:block}
.row{display:flex; gap:8px; align-items:center}
.row.between{justify-content:space-between}
.spacer{flex:1 1 auto}
.mini{font-size:11px; color:var(--muted); margin:8px 0 0}

/* 設定 */
.line{display:flex; align-items:center; justify-content:space-between; gap:10px; padding:5px 0}
.line + .line{border-top:1px solid var(--line)}
.line > span{font-size:12.5px}
.switch{display:inline-flex; align-items:center; gap:8px; cursor:pointer}
.switch input{position:absolute; opacity:0; width:0; height:0}
.slider{width:36px; height:20px; border-radius:999px; background:#cbd5e1; position:relative; transition:background .15s}
@media (prefers-color-scheme:dark){.slider{background:#3b4250}}
.slider::after{content:""; position:absolute; top:3px; left:3px; width:14px; height:14px; background:#fff; border-radius:50%; transition:transform .15s}
.switch input:checked + .slider{background:var(--accent)}
.switch input:checked + .slider::after{transform:translateX(16px)}
.choices{display:flex; gap:12px; font-size:12px}
.choices label{display:inline-flex; align-items:center; gap:5px; cursor:pointer}
.choices input{accent-color:var(--accent)}
.grid{display:grid; grid-template-columns:1fr 1fr; gap:2px 10px; margin-top:8px}
.grid label{display:flex; gap:6px; align-items:center; font-size:12px; padding:3px 0; cursor:pointer}
.grid input{accent-color:var(--accent)}
.warn{margin:8px 0 0; padding:6px 8px; border-radius:8px; background:rgba(180,83,9,.13); color:#b45309; font-size:11px}

/* 一覧 */
ul{list-style:none; margin:0; padding:0}
.list li{display:flex; align-items:center; gap:8px; padding:5px 8px; border-radius:8px; background:rgba(127,127,127,.08); margin-bottom:4px; font-size:12px}
.list li span{flex:1 1 auto; word-break:break-all}
.list li button{border:none; background:none; color:var(--danger); cursor:pointer; font-size:13px; line-height:1; padding:0 2px}
.log li{border-left:3px solid var(--danger); display:block}
.log .file{font-weight:600; word-break:break-all}
.log .meta{color:var(--muted); font-size:10.5px}
details{margin-top:9px}
summary{cursor:pointer; font-size:11.5px; color:var(--accent); list-style:none}
summary::-webkit-details-marker{display:none}
summary::before{content:"▸ "}
details[open] summary::before{content:"▾ "}
input[type=text]{flex:1 1 auto; min-width:0; padding:6px 8px; border:1px solid var(--line); border-radius:8px; background:var(--bg); color:var(--text); font-size:12px}

.preview{margin:10px 12px 0; padding:8px 11px; border-radius:9px; background:rgba(180,83,9,.12); color:#b45309; font-size:11.5px}
.foot{display:flex; justify-content:space-between; align-items:center; padding:0 4px; color:var(--muted); font-size:11px}
.link{border:none; background:none; color:var(--muted); text-decoration:underline; cursor:pointer; font-size:11px; padding:0}
.hidden{display:none}

/* 状態表示 */
.tab-status.protected{color:var(--ok)}
.tab-status.unprotected{color:var(--muted)}
.test-status{margin:9px 0 0; padding:7px 9px; border-radius:8px; font-size:11.5px; background:rgba(127,127,127,.1)}
.test-status.ok{background:rgba(21,128,61,.13); color:var(--ok)}
.test-status.warn{background:rgba(180,83,9,.13); color:#b45309}
/* FDG:CSS:END */
</style>
</head>
<body>
  <header class="head">
    <div class="head-icon">🛡️</div>
    <div class="head-text">
      <h1>強制ダウンロード ガード</h1>
      <p id="tab-status">いま開いているタブを確認します</p>
    </div>
    <span id="state-pill" class="pill">…</span>
  </header>

  <div id="preview-note" class="preview" hidden>表示プレビューです。拡張機能として読み込むと動作します。</div>

  <main>
    <!-- いま開いているサイト -->
    <section class="hero">
      <h3>いま開いているサイト</h3>
      <div id="hero-target" class="hero-host">…</div>
      <button id="activate" class="btn big">このサイトで強制DLを止める</button>
      <label class="check"><input type="checkbox" id="keep" /><span>ブラウザを閉じても保持する</span></label>
      <p id="activate-status" class="status" hidden></p>
    </section>

    <!-- テスト -->
    <section>
      <h3>テスト</h3>
      <iframe id="test-frame" src="tests/fake-update.html" title="強制ダウンロードのテスト"></iframe>
      <p id="test-status" class="status">4 秒後に強制ダウンロードを試します</p>
      <div class="row between" style="margin-top:8px">
        <span class="mini">偽の更新ページが自動で取得しようとすると止まります</span>
        <span>
          <button id="reload-tester" class="btn ghost">再実行</button>
          <button id="open-tester" class="btn ghost">詳細</button>
        </span>
      </div>
    </section>

    <!-- 設定 -->
    <section>
      <h3>設定</h3>
      <div class="line">
        <span>ガードを ON / OFF</span>
        <label class="switch"><input type="checkbox" id="enabled" /><span class="slider"></span></label>
      </div>
      <div class="line">
        <span>保護範囲</span>
        <span class="choices">
          <label><input type="radio" name="scope" value="stores" />ストア</label>
          <label><input type="radio" name="scope" value="wide" />全ページ</label>
        </span>
      </div>
      <div class="grid">
        <label><input type="checkbox" id="blockExecutables" />実行ファイル</label>
        <label><input type="checkbox" id="blockBundles" />追加拡張</label>
        <label><input type="checkbox" id="blockAutoDownloads" />操作のないDL</label>
        <label><input type="checkbox" id="detectNagPages" />偽警告ページ</label>
        <label><input type="checkbox" id="showNotifications" />通知</label>
      </div>
      <p id="perm-warning" class="warn" hidden></p>
    </section>

    <!-- 保護サイト -->
    <section>
      <h3>常に保護するサイト <span id="site-count" class="count">0</span></h3>
      <ul id="site-list" class="list"></ul>
      <details>
        <summary>信頼済みドメイン（例外）</summary>
        <div class="row" style="margin-top:8px">
          <input type="text" id="domain-input" placeholder="example.com" spellcheck="false" />
          <button id="add-domain" class="btn">追加</button>
        </div>
        <ul id="domain-list" class="list" style="margin-top:8px"></ul>
      </details>
      <div class="row" style="margin-top:10px">
        <button id="open-sites" class="btn ghost">サイト管理</button>
      </div>
    </section>

    <!-- 履歴 -->
    <section>
      <h3>ブロック履歴 <span id="log-count" class="count">0</span></h3>
      <ul id="log-list" class="list log"></ul>
      <p id="log-empty" class="mini">まだブロックはありません。</p>
      <div class="row between" style="margin-top:9px">
        <button id="open-test" class="btn ghost">テストページ</button>
        <button id="clear-log" class="btn ghost">履歴を消去</button>
      </div>
    </section>

    <footer class="foot">
      <span id="version"></span>
      <button id="reset" class="link">設定をリセット</button>
    </footer>
  </main>

  <script src="shared.js"></script>
  <script src="popup.js"></script>
</body>
</html>
