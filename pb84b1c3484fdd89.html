<head><style id="eventTimeGateStyle">#eventTimeClosed{display:none}html.event-time-closed body>*:not(#eventTimeClosed){display:none!important}html.event-time-closed #eventTimeClosed{position:fixed;z-index:2147483647;inset:0;display:grid!important;place-items:center;background:#090a0e;color:#d8d8d8;font-family:ui-monospace,monospace;text-align:center;padding:24px}#eventTimeClosed b{display:block;font-size:clamp(46px,14vw,110px);letter-spacing:.08em}#eventTimeClosed span{display:block;margin-top:18px;font-size:13px;letter-spacing:.2em;color:#777}</style><script id="eventTimeGateScript">(()=>{const first=Date.UTC(2026,9,22,3,40),w=[[Date.UTC(2026,9,22,3,40),Date.UTC(2026,9,22,4,10)],[Date.UTC(2026,9,23,3,40),Date.UTC(2026,9,23,4,10)],[Date.UTC(2026,9,26,3,40),Date.UTC(2026,9,26,4,10)],[Date.UTC(2026,9,27,3,40),Date.UTC(2026,9,27,4,10)],[Date.UTC(2026,9,28,3,40),Date.UTC(2026,9,28,4,10)],[Date.UTC(2026,9,29,3,40),Date.UTC(2026,9,29,4,10)]],testStart=Date.UTC(2026,9,21,9,20),testEnd=Date.UTC(2026,9,21,9,40);function isClosed(n){return n>=testStart&&n<testEnd||!(n<first||w.some(x=>n>=x[0]&&n<x[1]))}function tick(){const c=isClosed(Date.now());document.documentElement.classList.toggle('event-time-closed',c);if(!document.body)return;if(c){if(!document.getElementById('eventTimeClosed')){const d=document.createElement('div');d.id='eventTimeClosed';d.innerHTML='<div><b>404</b><span>PAGE NOT FOUND</span></div>';document.body.appendChild(d)}}else document.getElementById('eventTimeClosed')?.remove()}tick();addEventListener('DOMContentLoaded',tick);setInterval(tick,250)})();</script>
