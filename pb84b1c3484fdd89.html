<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>賞状</title>
<style>
  :root{
    --paper:#f7f1e1; --ink:#201a12; --gold:#b89334; --seal:#c0392b;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;overflow:hidden;background:#2b2419}
  body{font-family:"Yu Mincho","YuMincho","Hiragino Mincho ProN",serif;color:var(--ink);-webkit-text-size-adjust:100%}
  #viewport{position:fixed;inset:0;overflow:hidden}
  #scene{position:absolute;top:0;left:0;transform-origin:0 0}
  #paper{position:relative;background:
      radial-gradient(circle at 20% 10%,#fffaf0 0%,transparent 60%),
      radial-gradient(circle at 80% 85%,#fff7e6 0%,transparent 55%),
      var(--paper);
    border:14px double var(--gold);
    box-shadow:0 26px 60px rgba(0,0,0,.55);
    padding:46px 54px 60px;
  }
  #paper:before{content:"";position:absolute;inset:6px;border:1px solid #d9c89a;pointer-events:none}
  .title{
    writing-mode:vertical-rl;text-orientation:upright;
    font-size:54px;font-weight:700;letter-spacing:.3em;color:var(--gold);
    text-shadow:0 2px 0 #8c6f24;margin:0 0 10px auto;
  }
  #body{
    writing-mode:vertical-rl;text-orientation:upright;
    height:1180px;font-size:25px;line-height:2.05;letter-spacing:.06em;
    display:block;white-space:pre-wrap;
  }
  .ch{display:inline-block}
  .sp{display:inline-block;width:1em;height:1em}
  #sign{
    writing-mode:horizontal-tb;text-align:left;
    font:700 40px/1.2 "Trebuchet MS",sans-serif;letter-spacing:.14em;
    color:#1a1a1a;margin-top:26px;
  }
  #seal{
    position:absolute;right:52px;bottom:58px;width:92px;height:92px;border-radius:10px;
    border:5px solid var(--seal);color:var(--seal);
    display:grid;place-items:center;font-size:27px;line-height:1.05;text-align:center;
    transform:rotate(-7deg);opacity:.9;writing-mode:vertical-rl;text-orientation:upright;letter-spacing:.1em;
  }
  #player{position:absolute;width:26px;height:30px;z-index:30;will-change:transform}
  #player .body{position:absolute;inset:0;background:#2b6cb0;border:2px solid #16314d;border-radius:6px 6px 4px 4px}
  #player .cap{position:absolute;left:-2px;right:-2px;top:-6px;height:9px;background:#c0392b;border:2px solid #7b2318;border-radius:5px}
  #player .eye{position:absolute;left:15px;top:9px;width:5px;height:5px;background:#fff;border-radius:50%}
  #player.left .eye{left:6px}
  .conf{position:absolute;width:13px;height:13px;z-index:20;border-radius:2px;will-change:transform}
  .puff{position:absolute;z-index:40;font-size:15px;font-weight:700;color:var(--gold);pointer-events:none}
  #hud{
    position:fixed;left:10px;top:10px;z-index:100;display:flex;gap:8px;align-items:center;
    background:rgba(20,18,14,.74);color:#ffe9b0;border-radius:9px;padding:7px 11px;
    font:700 13px/1 ui-monospace,monospace;letter-spacing:.08em;
  }
  #hud b{font-size:15px;color:#fff}
  #help{
    position:fixed;right:10px;top:10px;z-index:100;max-width:46vw;
    background:rgba(20,18,14,.74);color:#efe6d2;border-radius:9px;padding:7px 11px;
    font:500 11.5px/1.5 ui-monospace,monospace;
  }
  #pad{position:fixed;left:0;right:0;bottom:0;z-index:100;display:flex;justify-content:space-between;padding:12px;pointer-events:none}
  #pad div{display:flex;gap:10px;pointer-events:auto}
  #pad button{
    width:62px;height:62px;border-radius:50%;border:2px solid rgba(255,255,255,.35);
    background:rgba(20,18,14,.52);color:#fff;font-size:22px;touch-action:none;
  }
  #pad button:active{background:rgba(20,18,14,.8)}
  @media(hover:hover) and (pointer:fine){#pad{display:none}}
  #clear{
    position:fixed;inset:0;z-index:200;display:none;place-items:center;background:rgba(14,12,9,.78);
    color:#ffe9b0;text-align:center;font:700 clamp(20px,5vw,34px)/1.6 serif;letter-spacing:.1em;padding:24px;
  }
  #clear.on{display:grid}
  #clear small{display:block;margin-top:14px;font:500 13px/1.8 ui-monospace,monospace;color:#f0e6cc}
</style>
</head>
<body>

<div id="viewport">
  <div id="scene">
    <div id="paper">
      <div class="title">賞　状</div>
      <div id="body"></div>
      <div id="sign">ink3</div>
      <div id="seal">科技部</div>
    </div>
  </div>
</div>

<div id="hud">紙吹雪 <b><span id="got">0</span>/<span id="all">0</span></b></div>
<div id="help">←→ 移動　スペース/↑ ジャンプ<br>文字の上に乗れます</div>
<div id="pad">
  <div><button id="bl" aria-label="左">◀</button><button id="br" aria-label="右">▶</button></div>
  <div><button id="bj" aria-label="ジャンプ">▲</button></div>
</div>
<div id="clear">全部あつめました！<small>おめでとうございます。放課後、部室で待ってます。</small></div>

<script>
(() => {
'use strict';

const TEXT = [
"おめでとうございます！",
"マジか。まさかクリア者でるとは思わなかったです。",
"このサイトの開発者のインク3がこういう謎解き系の要素を",
"どうしても組み込みたくてクリアできない想定で作ってるんですよ。",
"最初の謎解きだけならまだしも、スタッフロールまではキツかったでしょ。",
"しかも2日で。",
"となると他ゲームやってない感じか？",
"勇気凄すぎないですか？",
"それにしても驚いた。",
"部活の色々のルールのせいでプレゼントとかないんですけど、",
"この画面来てたら部員に教えてください。",
"そんな知恵×プレイスキル×勇気を併せ持つ",
"貴方には物凄くクォリティの高いゲームを上げたいんですが、",
"なんせクリア者いない想定なもんで。",
"ごめんなさいこんなゲームで。",
"もし時間あったら放課後に部室来て賞状見ました！と",
"言ってもらえれば迎え入れて好きなだけゲーム遊んでもらっていいですよ。",
"とにかく、僕の仕掛けを発見していただきありがとうございました！"
];

const bodyEl = document.getElementById('body');
const frag = document.createDocumentFragment();
TEXT.forEach((line, i) => {
  for (const c of line) {
    if (c === ' ' || c === '　') { const s = document.createElement('span'); s.className = 'sp'; frag.appendChild(s); continue; }
    const s = document.createElement('span');
    s.className = 'ch';
    s.textContent = c;
    frag.appendChild(s);
  }
  if (i < TEXT.length - 1) frag.appendChild(document.createElement('br'));
});
bodyEl.appendChild(frag);

const scene = document.getElementById('scene');
const paper = document.getElementById('paper');
const viewport = document.getElementById('viewport');
const gotEl = document.getElementById('got');
const allEl = document.getElementById('all');
const clearEl = document.getElementById('clear');

let W = 0, H = 0, plats = [], confs = [], collected = 0;

const player = document.createElement('div');
player.id = 'player';
player.innerHTML = '<div class="body"></div><div class="cap"></div><div class="eye"></div>';
scene.appendChild(player);

const P = { x: 60, y: 0, vx: 0, vy: 0, w: 26, h: 30, onGround: false, face: 1 };

function buildWorld() {
  const pr = paper.getBoundingClientRect();
  const sr = scene.getBoundingClientRect();
  W = pr.width; H = pr.height;

  plats = [{ x: 0, y: H - 18, w: W, h: 18 }];

  document.querySelectorAll('.ch').forEach(el => {
    const r = el.getBoundingClientRect();
    if (r.width < 6 || r.height < 6) return;
    plats.push({
      x: r.left - sr.left,
      y: r.top - sr.top,
      w: r.width,
      h: Math.max(8, r.height * 0.5),
      el
    });
  });

  const sign = document.getElementById('sign').getBoundingClientRect();
  plats.push({ x: sign.left - sr.left, y: sign.top - sr.top, w: sign.width, h: 10 });

  confs.forEach(c => c.el.remove());
  confs = [];
  const colors = ['#e74c3c', '#f1c40f', '#27ae60', '#2980b9', '#8e44ad', '#e67e22'];
  const pool = plats.filter(p => p.el);
  const step = Math.max(1, Math.floor(pool.length / 30));
  for (let i = 0; i < pool.length; i += step) {
    const p = pool[i];
    const el = document.createElement('div');
    el.className = 'conf';
    el.style.background = colors[(i / step | 0) % colors.length];
    const x = p.x + p.w / 2 - 6;
    const y = p.y - 24;
    el.style.transform = `translate(${x}px,${y}px) rotate(18deg)`;
    scene.appendChild(el);
    confs.push({ x, y, el, got: false, t: Math.random() * 6 });
    if (confs.length >= 30) break;
  }
  allEl.textContent = confs.length;

  P.x = Math.min(60, W - 40);
  P.y = H - 60;
  P.vx = P.vy = 0;
}

const keys = Object.create(null);
addEventListener('keydown', e => {
  if ([' ', 'ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown'].includes(e.key)) e.preventDefault();
  keys[e.key] = true;
});
addEventListener('keyup', e => { keys[e.key] = false; });

function hold(id, key) {
  const b = document.getElementById(id);
  const on = e => { e.preventDefault(); keys[key] = true; };
  const off = e => { e.preventDefault(); keys[key] = false; };
  b.addEventListener('touchstart', on, { passive: false });
  b.addEventListener('touchend', off, { passive: false });
  b.addEventListener('touchcancel', off, { passive: false });
  b.addEventListener('mousedown', on);
  addEventListener('mouseup', off);
}
hold('bl', 'ArrowLeft');
hold('br', 'ArrowRight');
hold('bj', ' ');

function puff(x, y, text) {
  const d = document.createElement('div');
  d.className = 'puff';
  d.textContent = text;
  d.style.transform = `translate(${x}px,${y}px)`;
  scene.appendChild(d);
  let t = 0;
  const id = setInterval(() => {
    t += 1;
    d.style.transform = `translate(${x}px,${y - t * 1.6}px)`;
    d.style.opacity = String(1 - t / 26);
    if (t > 26) { clearInterval(id); d.remove(); }
  }, 16);
}

const GRAV = 0.62, MOVE = 0.72, MAXV = 5.1, FRICT = 0.82, JUMP = -11.6;
let last = performance.now();

function step(now) {
  const dt = Math.min(2.4, (now - last) / 16.67);
  last = now;

  const left = keys['ArrowLeft'] || keys['a'] || keys['A'];
  const right = keys['ArrowRight'] || keys['d'] || keys['D'];
  const jump = keys[' '] || keys['ArrowUp'] || keys['w'] || keys['W'];

  if (left) { P.vx -= MOVE * dt; P.face = -1; }
  if (right) { P.vx += MOVE * dt; P.face = 1; }
  if (!left && !right) P.vx *= Math.pow(FRICT, dt);
  P.vx = Math.max(-MAXV, Math.min(MAXV, P.vx));

  if (jump && P.onGround) { P.vy = JUMP; P.onGround = false; }
  P.vy = Math.min(16, P.vy + GRAV * dt);

  P.x += P.vx * dt;
  if (P.x < 0) { P.x = 0; P.vx = 0; }
  if (P.x + P.w > W) { P.x = W - P.w; P.vx = 0; }

  const prevBottom = P.y + P.h;
  P.y += P.vy * dt;
  const bottom = P.y + P.h;

  P.onGround = false;
  if (P.vy >= 0) {
    for (const p of plats) {
      if (P.x + P.w - 3 < p.x || P.x + 3 > p.x + p.w) continue;
      if (prevBottom <= p.y + 2 && bottom >= p.y) {
        P.y = p.y - P.h;
        P.vy = 0;
        P.onGround = true;
        if (p.el) {
          p.el.style.transition = 'transform .12s';
          p.el.style.transform = 'translateY(2px)';
          setTimeout(() => { p.el.style.transform = ''; }, 120);
        }
        break;
      }
    }
  }

  if (P.y > H + 300) { P.x = 60; P.y = H - 60; P.vx = P.vy = 0; }

  player.className = P.face < 0 ? 'left' : '';
  player.style.transform = `translate(${P.x}px,${P.y}px)`;

  for (const c of confs) {
    if (c.got) continue;
    c.t += 0.08 * dt;
    c.el.style.transform = `translate(${c.x}px,${c.y + Math.sin(c.t) * 4}px) rotate(${Math.sin(c.t) * 40}deg)`;
    if (P.x < c.x + 13 && P.x + P.w > c.x && P.y < c.y + 13 && P.y + P.h > c.y) {
      c.got = true;
      c.el.remove();
      collected++;
      gotEl.textContent = collected;
      puff(c.x - 4, c.y - 6, '+1');
      if (collected >= confs.length) clearEl.classList.add('on');
    }
  }

  const vw = viewport.clientWidth, vh = viewport.clientHeight;
  const scale = Math.min(1, vw / (W + 40));
  let camY = P.y * scale - vh * 0.55;
  const maxY = Math.max(0, H * scale - vh + 40);
  camY = Math.max(0, Math.min(maxY, camY));
  const offX = Math.max(0, (vw - W * scale) / 2);
  scene.style.transform = `translate(${offX}px,${-camY}px) scale(${scale})`;

  requestAnimationFrame(step);
}

function boot() {
  scene.style.transform = 'translate(0,0) scale(1)';
  buildWorld();
  requestAnimationFrame(step);
}

if (document.fonts && document.fonts.ready) document.fonts.ready.then(boot); else addEventListener('load', boot);
let rt;
addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(() => { collected = 0; gotEl.textContent = '0'; clearEl.classList.remove('on'); buildWorld(); }, 220); });
})();
</script>
</body>
</html>
