<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>サイトセキュリティ</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f4f6f8;color:#202a34;font:15px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}.wrap{max-width:760px;margin:56px auto;padding:0 20px}.header{display:flex;align-items:center;justify-content:space-between;margin-bottom:25px}.brand{font-weight:700;font-size:17px}.badge{font-size:12px;color:#705613;background:#fff3cc;border:1px solid #f0dc9b;border-radius:20px;padding:4px 10px}.notice{background:#fff;border:1px solid #e2e6ea;border-left:3px solid #e0a92f;border-radius:8px;padding:12px 14px;color:#59636e;font-size:13px;margin-bottom:18px}.card{background:#fff;border:1px solid #e2e6ea;border-radius:12px;padding:22px;box-shadow:0 5px 20px #18293a08}.title{font-size:18px;font-weight:700;margin:0 0 19px}.field{margin:14px 0}.field label{display:block;font-size:12px;color:#697581;margin-bottom:6px}.field input{width:100%;padding:11px 12px;border:1px solid #d6dde3;border-radius:7px;font:inherit;color:#202a34;background:#fff}.status{display:flex;align-items:center;gap:10px;border-top:1px solid #edf0f2;margin-top:19px;padding-top:18px}.dot{width:9px;height:9px;background:#aab3bb;border-radius:50%}.dot.on{background:#36a875}.state{font-weight:650}.sub{display:block;color:#7a858f;font-size:12px}.rows{margin-top:19px;border-top:1px solid #edf0f2}.row{display:flex;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid #edf0f2;font-size:13px}.row span:first-child{color:#697581}.row strong{font-weight:600;text-align:right;overflow-wrap:anywhere}.btn{width:100%;margin-top:19px;padding:11px;border:0;border-radius:7px;background:#2469c9;color:#fff;font:inherit;font-weight:650;cursor:pointer}.btn.stop{background:#e9edf1;color:#34404b}.foot{font-size:12px;color:#7a858f;text-align:center;margin:18px 0 35px}@media(max-width:520px){.wrap{margin:30px auto}.card{padding:17px}.row{font-size:12px}}

</style></head><body><main class="wrap"><header class="header"><div class="brand">サイト監視パネル</div><span class="badge">検出ソフト</span></header>
<div class="notice">ハッキングが検知された瞬間通知を送ります</div>
<section class="card"><h1 class="title">監視設定</h1><div class="field"><label for="site">サイト</label><input id="site" type="url" value="https://example.com" placeholder="https://example.com"></div><div class="field"><label for="device">監視デバイス</label><input id="device" value="Chromebook" placeholder="デバイス名"></div>
<div class="status"><span class="dot" id="dot"></span><div><span class="state" id="state">停止中</span><span class="sub" id="detail">通知：2秒以内</span></div></div>
<div class="rows"><div class="row"><span>監視対象</span><strong id="siteLabel">https://example.com</strong></div><div class="row"><span>対象機器</span><strong id="deviceLabel">Chromebook</strong></div><div class="row"><span>検査状態</span><strong>良好</strong></div></div>
<div id="easterEgg" style="display:none;margin-top:14px;padding:12px;border-radius:7px;background:#edf7ee;color:#23633d;font-size:13px">ここはデバイス名を表示する欄です</div>
<button class="btn" id="toggle">検査を開始</button>
<div class="event-log" id="eventLog"><h2>検知イベント</h2><table><thead><tr><th>検知時刻</th><th>攻撃元デバイス名</th><th>攻撃方法</th></tr></thead><tbody id="eventRows"><tr><td class="empty-row" colspan="3">イベントデータ待機中</td></tr></tbody></table></div></section><p class="foot">セキュリティの監視中</p></main>
