<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>配信画面スタジオ</title>
<style>
  *{box-sizing:border-box}
  :root{--panel:#ffffff;--panel2:#f3f5fb;--line:#d7dcea;--text:#1b1f2b;--sub:#5d6478;
        --accent:#5b48e0;--accent2:#0a9c86;--danger:#e0344f}
  html,body{margin:0;height:100%;background:#e8ecf6;color:var(--text);overflow:hidden;
    font-family:"Hiragino Kaku Gothic ProN","Yu Gothic UI",Meiryo,sans-serif}
  body{display:flex;flex-direction:column}

  /* ===== 上部バー ===== */
  #bar{flex:0 0 auto;display:flex;align-items:center;gap:8px;padding:8px 10px;
    background:var(--panel);border-bottom:1px solid var(--line);z-index:50}
  #brand{font-weight:900;font-size:13px;letter-spacing:.07em;color:var(--accent);margin-right:4px}
  button{appearance:none;border:1px solid var(--line);background:#f7f8fd;color:var(--text);
    border-radius:8px;padding:7px 11px;font:700 12px/1 inherit;cursor:pointer;white-space:nowrap}
  button:hover{border-color:var(--accent)}
  button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
  button.warn{background:#3a1f29;border-color:var(--danger);color:#ffb3c2}
  select,input[type=text],input[type=number],textarea{background:#fff;color:var(--text);
    border:1px solid var(--line);border-radius:7px;padding:7px;font:13px/1.4 inherit}
  #spacer{margin-left:auto;display:flex;gap:8px;align-items:center}

  /* ===== ステージ ===== */
  #outer{flex:1 1 auto;position:relative;min-height:0;overflow:hidden;background:#dde3f1;
    display:flex;align-items:center;justify-content:center}
  #stage{position:relative;transform-origin:center center;background:#eef3ff;overflow:hidden;
    box-shadow:0 6px 24px rgba(20,30,60,.25)}
  .w{position:absolute;overflow:hidden;border-radius:10px}
  .w.sel{outline:2px solid var(--accent);outline-offset:1px}
  .wbar{position:absolute;left:0;right:0;top:0;height:22px;background:rgba(124,92,255,.55);
    display:flex;align-items:center;gap:6px;padding:0 6px;font-size:11px;font-weight:800;cursor:move;z-index:3}
  .wbar .x{margin-left:auto;cursor:pointer;opacity:.9}
  .wbody{position:absolute;inset:0;overflow:hidden}
  .grip{position:absolute;right:0;bottom:0;width:16px;height:16px;cursor:nwse-resize;z-index:4;
    background:linear-gradient(135deg,transparent 50%,rgba(124,92,255,.9) 50%)}
  body.live .wbar,body.live .grip{display:none}
  body.live #bar,body.live #side{display:none}
  body.live #outer{background:#000}

  /* 部品の見た目 */
  .chat{display:flex;flex-direction:column;height:100%;background:rgba(255,255,255,.88);
    border:1px solid rgba(30,40,70,.18);border-radius:12px;color:#1b1f2b}
  .chat .hd{flex:0 0 auto;padding:6px 10px;font-size:11px;font-weight:800;letter-spacing:.05em;
    background:rgba(91,72,224,.16);display:flex;gap:6px;align-items:center}
  .chat .hd .dot{width:7px;height:7px;border-radius:50%;background:#ff5470}
  .chat .hd .dot.live{background:#3fe081}
  .chat .lg{flex:1 1 auto;overflow:auto;padding:7px 9px;display:flex;flex-direction:column;gap:5px}
  .chat .m{font-size:14px;line-height:1.5;word-break:break-word}
  .chat .m b{color:#b8860b;font-size:12px;margin-right:6px}
  .txt{width:100%;height:100%;display:flex;padding:6px 10px;word-break:break-word;white-space:pre-wrap}
  .img{width:100%;height:100%;object-fit:contain;display:block}
  .urlbox{width:100%;height:100%;border:0;display:block;background:#000}
  .cap{width:100%;height:100%;display:flex;align-items:flex-end;padding:10px;
    font-weight:800;text-shadow:0 1px 3px rgba(255,255,255,.75);word-break:break-word}
  .avatar{width:100%;height:100%;display:block}
  .camv{width:100%;height:100%;object-fit:cover;display:block;background:#000}

  /* ===== 右パネル ===== */
  #side{position:absolute;right:0;top:0;bottom:0;width:320px;background:var(--panel);
    border-left:1px solid var(--line);padding:12px;overflow:auto;z-index:40;display:none}
  #side.on{display:block}
  #side h3{margin:0 0 8px;font-size:12px;letter-spacing:.08em;color:var(--accent2)}
  .card{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:10px;margin-bottom:10px}
  label.f{display:block;font-size:11px;color:var(--sub);margin-bottom:8px}
  label.f>*{margin-top:4px}
  .row{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
  .full{width:100%}
  .mini{font-size:10.5px;color:#7f8498;line-height:1.7}
  .parts{display:grid;grid-template-columns:1fr 1fr;gap:6px}
  .parts button{padding:10px 6px;font-size:11.5px}
  #gear{position:fixed;right:10px;top:8px;z-index:60}
  #picker{position:fixed;inset:0;z-index:80;background:rgba(232,236,246,.96);display:none;
    flex-direction:column;padding:26px 30px}
  #picker.on{display:flex}
  #picker h2{margin:0 0 4px;font-size:22px}
  #picker .sub{font-size:12.5px;color:var(--sub);margin-bottom:18px}
  #pgrid{flex:1 1 auto;display:grid;gap:14px;overflow:auto;
    grid-template-columns:repeat(auto-fill,minmax(210px,1fr));align-content:start}
  .pcard{border:1px solid var(--line);background:#fff;border-radius:14px;padding:18px;cursor:pointer;
    display:flex;flex-direction:column;gap:6px;text-align:left;box-shadow:0 2px 8px rgba(20,30,60,.08)}
  .pcard:hover{border-color:var(--accent);transform:translateY(-2px)}
  .pcard .ic{font-size:26px}
  .pcard .nm{font-weight:900;font-size:14px}
  .pcard .ds{font-size:11.5px;color:var(--sub);line-height:1.6}
  body.live #gear{opacity:.12}
  body.live #gear:hover{opacity:1}
</style>
</head>
<body>
<div id="bar">
  <span id="brand">配信画面スタジオ</span>
  <button id="addBtn" class="primary">＋ パーツを追加</button>
  <button id="bgBtn">背景</button>
  <button id="liveBtn">配信用表示</button>
  <div id="spacer">
    <span class="mini" id="hint">パーツはつかんで移動、右下でサイズ変更</span>
  </div>
</div>

<div id="outer"><div id="stage"></div></div>
<button id="gear">⚙ 設定</button>

<div id="side">
  <div id="sideBody"></div>
</div>

<div id="picker">
  <h2>パーツを追加</h2>
  <div class="sub">置きたいものを選んでください。あとから位置も大きさも変えられます。</div>
  <div id="pgrid"></div>
  <div style="margin-top:16px"><button id="pClose">閉じる</button></div>
</div>

<input type="file" id="fileBg" accept="image/*" hidden>
<input type="file" id="fileImg" accept="image/*" hidden>
<input type="file" id="fileLayout" accept="application/json" hidden>

<script>
(function () {
  "use strict";
  var $ = function (id) { return document.getElementById(id); };
  var stage = $("stage"), outer = $("outer"), side = $("side"), sideBody = $("sideBody");
  var CHAT_WS = "wss://knj48-ver-chatsystem.onrender.com";

  /* ============ 状態 ============ */
  var S = {
    w: 1280, h: 720,
    bg: { color: "#eef3ff", image: "" },
    widgets: [],
    tts: { on: true, volume: 1, rate: 1.1, voice: "", name: true },
    seq: 1
  };
  try {
    var saved = JSON.parse(localStorage.getItem("studio_v1") || "null");
    if (saved && saved.widgets) S = Object.assign(S, saved);
  } catch (e) {}
  function save() { try { localStorage.setItem("studio_v1", JSON.stringify(S)); } catch (e) {} }

  /* ============ 読み上げ ============ */
  var voices = [], queue = [], speaking = false;
  function loadVoices() { try { voices = speechSynthesis.getVoices() || []; } catch (e) { voices = []; } }
  try { speechSynthesis.onvoiceschanged = loadVoices; } catch (e) {}
  loadVoices();
  function pump() {
    if (speaking || !queue.length) return;
    var t = queue.shift();
    try {
      var u = new SpeechSynthesisUtterance(t);
      u.lang = "ja-JP";
      u.volume = S.tts.volume;
      u.rate = S.tts.rate;
      if (S.tts.voice !== "" && voices[S.tts.voice]) u.voice = voices[S.tts.voice];
      else { var ja = voices.filter(function (v) { return /ja/i.test(v.lang); })[0]; if (ja) u.voice = ja; }
      speaking = true;
      u.onend = u.onerror = function () { speaking = false; setTimeout(pump, 50); };
      speechSynthesis.speak(u);
    } catch (e) { speaking = false; }
  }
  function speak(name, text) {
    if (!S.tts.on) return;
    var body = ((S.tts.name && name ? name + "、" : "") + text)
      .replace(/https?:\/\/\S+/g, "リンク").replace(/\s+/g, " ").slice(0, 160);
    if (!body.trim()) return;
    if (queue.length > 8) queue.shift();
    queue.push(body); pump();
  }

  /* ============ チャット接続（共有） ============ */
  var chatSubs = [], cws = null, cTimer = 0, cRetry = 0, cReady = false, cSeen = Object.create(null), cLive = false;
  function chatConnect() {
    try { cws = new WebSocket(CHAT_WS); } catch (e) { return chatSchedule(); }
    cws.onopen = function () {
      cRetry = 0; cReady = false; cLive = true;
      setTimeout(function () { cReady = true; }, 2500);
      chatSubs.forEach(function (f) { f.live(true); });
    };
    cws.onmessage = function (ev) {
      var d; try { d = JSON.parse(ev.data); } catch (e) { return; }
      if (!d) return;
      var list = Array.isArray(d) ? d : (Array.isArray(d.messages) ? d.messages : [d]);
      list.forEach(function (m) {
        if (!m || typeof m.text !== "string") return;
        var key = (m.timestamp || "") + "|" + (m.senderId || "") + "|" + m.text;
        if (cSeen[key]) return;
        cSeen[key] = 1;
        var name = String(m.senderId || m.name || "ゲスト").slice(0, 20);
        var fresh = cReady;
        chatSubs.forEach(function (f) { f.msg(name, m.text, fresh); });
      });
    };
    cws.onclose = function () { cLive = false; chatSubs.forEach(function (f) { f.live(false); }); chatSchedule(); };
    cws.onerror = function () {};
  }
  function chatSchedule() { clearTimeout(cTimer); cRetry++; cTimer = setTimeout(chatConnect, Math.min(1500 * cRetry, 8000)); }
  function chatSend(name, text) {
    if (!cws || cws.readyState !== 1) return false;
    cws.send(JSON.stringify({ text: text, name: name || "ゲスト" }));
    return true;
  }
  chatConnect();

  /* ============ マイク（アバター・文字起こし用） ============ */
  var micStream = null, micCtx = null, micAnalyser = null, micData = null, micLevel = 0;
  async function ensureMic() {
    if (micStream) return micStream;
    micStream = await navigator.mediaDevices.getUserMedia({ audio: true });
    micCtx = new (window.AudioContext || window.webkitAudioContext)();
    var src = micCtx.createMediaStreamSource(micStream);
    micAnalyser = micCtx.createAnalyser();
    micAnalyser.fftSize = 512;
    micData = new Uint8Array(micAnalyser.frequencyBinCount);
    src.connect(micAnalyser);
    return micStream;
  }
  function micTick() {
    if (micAnalyser) {
      micAnalyser.getByteTimeDomainData(micData);
      var sum = 0;
      for (var i = 0; i < micData.length; i++) { var v = (micData[i] - 128) / 128; sum += v * v; }
      var rms = Math.sqrt(sum / micData.length);
      micLevel = micLevel * 0.6 + Math.min(1, rms * 6) * 0.4;
    }
    requestAnimationFrame(micTick);
  }
  requestAnimationFrame(micTick);

  /* ============ カメラ追従（顔の位置と傾き） ============ */
  var TRACK = { on: false, x: 0, y: 0, tilt: 0, scale: 1, ok: false };
  var trkVideo = null, trkCanvas = null, trkCtx = null, trkStream = null;
  async function ensureTracker() {
    if (TRACK.on) return;
    TRACK.on = true;
    try {
      trkStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "user", width: 320, height: 240 }, audio: false });
    } catch (e) { TRACK.on = false; return; }
    trkVideo = document.createElement("video");
    trkVideo.srcObject = trkStream; trkVideo.muted = true; trkVideo.playsInline = true;
    try { await trkVideo.play(); } catch (e) {}
    trkCanvas = document.createElement("canvas");
    trkCanvas.width = 80; trkCanvas.height = 60;
    trkCtx = trkCanvas.getContext("2d", { willReadFrequently: true });
    requestAnimationFrame(trackStep);
  }
  function trackStep() {
    if (!TRACK.on) return;
    requestAnimationFrame(trackStep);
    if (!trkVideo || !trkVideo.videoWidth) return;
    try { trkCtx.drawImage(trkVideo, 0, 0, 80, 60); } catch (e) { return; }
    var d;
    try { d = trkCtx.getImageData(0, 0, 80, 60).data; } catch (e) { return; }
    var sx = 0, sy = 0, n = 0, lx = 0, ly = 0, rx = 0, ry = 0, ln = 0, rn = 0;
    for (var y = 0; y < 60; y++) {
      for (var x = 0; x < 80; x++) {
        var i = (y * 80 + x) * 4;
        var r = d[i], g = d[i + 1], b = d[i + 2];
        var mx = Math.max(r, g, b), mn = Math.min(r, g, b);
        var skin = r > 70 && g > 35 && b > 20 && r > g && r > b && (mx - mn) > 12 && Math.abs(r - g) > 10;
        if (!skin) continue;
        sx += x; sy += y; n++;
        if (x < 40) { lx += x; ly += y; ln++; } else { rx += x; ry += y; rn++; }
      }
    }
    if (n < 40) { TRACK.ok = false; return; }
    TRACK.ok = true;
    var cx = sx / n, cy = sy / n;
    var nx = (cx / 80 - 0.5) * 2, ny = (cy / 60 - 0.5) * 2;
    var tilt = 0;
    if (ln > 10 && rn > 10) tilt = ((ry / rn) - (ly / ln)) / 20;
    var sc = Math.max(0.75, Math.min(1.35, Math.sqrt(n / 900)));
    TRACK.x += (nx - TRACK.x) * 0.25;
    TRACK.y += (ny - TRACK.y) * 0.25;
    TRACK.tilt += (tilt - TRACK.tilt) * 0.2;
    TRACK.scale += (sc - TRACK.scale) * 0.15;
  }

  /* ============ ステージ描画 ============ */
  function fit() {
    var pad = 20;
    var aw = outer.clientWidth - pad, ah = outer.clientHeight - pad;
    if (aw <= 0 || ah <= 0) return;
    var sc = Math.min(aw / S.w, ah / S.h);
    if (!isFinite(sc) || sc <= 0) sc = 1;
    stage.style.width = S.w + "px";
    stage.style.height = S.h + "px";
    stage.style.transform = "scale(" + sc + ")";
    stage.dataset.scale = sc;
  }
  window.addEventListener("resize", fit);

  function applyBg() {
    stage.style.background = S.bg.image
      ? "#000 center/contain no-repeat url(" + JSON.stringify(S.bg.image) + ")"
      : S.bg.color;
    if (S.bg.image) stage.style.backgroundSize = "cover";
  }

  var nodes = {};
  function render() {
    stage.innerHTML = "";
    nodes = {};
    S.widgets.forEach(build);
    applyBg(); fit();
  }

  function newWidget(type) {
    var id = "w" + (S.seq++);
    var base = { id: id, type: type, x: 60, y: 60, w: 380, h: 240, z: S.widgets.length + 1 };
    if (type === "text") { base.text = "ここに文字"; base.size = 40; base.color = "#1b1f2b"; base.bold = true; base.h = 90; base.w = 500; }
    if (type === "image") { base.src = ""; }
    if (type === "url") { base.url = ""; base.w = 640; base.h = 360; }
    if (type === "chat" || type === "chat2") { base.w = 340; base.h = 300; base.send = true; base.nick = ""; }
    if (type === "caption") { base.size = 34; base.color = "#1b1f2b"; base.h = 120; base.w = 760; base.lines = 2; }
    if (type === "avatar") { base.design = "neko"; base.w = 280; base.h = 280; base.mic = true; base.track = true; }
    if (type === "camera") { base.w = 320; base.h = 240; base.round = true; base.mirror = true; }
    if (type === "clock") { base.w = 320; base.h = 110; base.size = 54; base.color = "#1b1f2b";
      base.sec = true; base.date = false; base.bg = true; }
    S.widgets.push(base); save(); render(); select(id);
    return base;
  }

  function build(wd) {
    var el = document.createElement("div");
    el.className = "w"; el.dataset.id = wd.id;
    el.style.left = wd.x + "px"; el.style.top = wd.y + "px";
    el.style.width = wd.w + "px"; el.style.height = wd.h + "px";
    el.style.zIndex = wd.z || 1;

    var bar = document.createElement("div");
    bar.className = "wbar";
    bar.innerHTML = "<span>" + label(wd.type) + "</span><span class='x'>✕</span>";
    el.appendChild(bar);

    var body = document.createElement("div");
    body.className = "wbody";
    body.style.paddingTop = "0";
    el.appendChild(body);

    var grip = document.createElement("div");
    grip.className = "grip";
    el.appendChild(grip);

    stage.appendChild(el);
    nodes[wd.id] = { el: el, body: body, data: wd };
    mount(wd, body);

    bar.addEventListener("pointerdown", function (e) {
      if (e.target.classList.contains("x")) return;
      startDrag(e, wd, el, "move");
    });
    bar.querySelector(".x").addEventListener("click", function () { removeWidget(wd.id); });
    grip.addEventListener("pointerdown", function (e) { startDrag(e, wd, el, "size"); });
    el.addEventListener("pointerdown", function () { select(wd.id); }, true);
  }

  function label(t) {
    return { chat: "チャット（読み上げあり）", chat2: "チャット", text: "テキスト", image: "画像",
      url: "URLボックス", caption: "文字起こし", avatar: "アバター", camera: "カメラ",
      clock: "時計" }[t] || t;
  }

  function startDrag(e, wd, el, mode) {
    e.preventDefault();
    var sc = Number(stage.dataset.scale) || 1;
    var sx = e.clientX, sy = e.clientY, ox = wd.x, oy = wd.y, ow = wd.w, oh = wd.h;
    function mv(ev) {
      var dx = (ev.clientX - sx) / sc, dy = (ev.clientY - sy) / sc;
      if (mode === "move") {
        wd.x = Math.round(Math.max(-40, Math.min(S.w - 40, ox + dx)));
        wd.y = Math.round(Math.max(-10, Math.min(S.h - 30, oy + dy)));
        el.style.left = wd.x + "px"; el.style.top = wd.y + "px";
      } else {
        wd.w = Math.round(Math.max(80, ow + dx));
        wd.h = Math.round(Math.max(60, oh + dy));
        el.style.width = wd.w + "px"; el.style.height = wd.h + "px";
      }
    }
    function up() {
      document.removeEventListener("pointermove", mv);
      document.removeEventListener("pointerup", up);
      save(); if (selId === wd.id) openInspector(wd);
    }
    document.addEventListener("pointermove", mv);
    document.addEventListener("pointerup", up);
  }

  function removeWidget(id) {
    var n = nodes[id];
    if (n && n.cleanup) n.cleanup();
    S.widgets = S.widgets.filter(function (w) { return w.id !== id; });
    save(); render(); closeSide();
  }

  /* ============ 各パーツの中身 ============ */
  function mount(wd, body) {
    if (wd.type === "chat" || wd.type === "chat2") return mountChat(wd, body);
    if (wd.type === "text") return mountText(wd, body);
    if (wd.type === "image") return mountImage(wd, body);
    if (wd.type === "url") return mountUrl(wd, body);
    if (wd.type === "caption") return mountCaption(wd, body);
    if (wd.type === "avatar") return mountAvatar(wd, body);
    if (wd.type === "camera") return mountCamera(wd, body);
    if (wd.type === "clock") return mountClock(wd, body);
  }

  function mountChat(wd, body) {
    var wrap = document.createElement("div"); wrap.className = "chat";
    var hd = document.createElement("div"); hd.className = "hd";
    hd.innerHTML = "<span class='dot'></span><span>チャット</span>";
    var lg = document.createElement("div"); lg.className = "lg";
    wrap.appendChild(hd); wrap.appendChild(lg);
    if (wd.send) {
      var row = document.createElement("div");
      row.style.cssText = "display:flex;gap:4px;padding:6px;border-top:1px solid rgba(255,255,255,.1)";
      var inp = document.createElement("input");
      inp.type = "text"; inp.placeholder = "メッセージ"; inp.maxLength = 200;
      inp.style.cssText = "flex:1;min-width:0;background:#fff;color:#1b1f2b;border:1px solid #d7dcea;border-radius:6px;padding:6px;font:13px/1.3 inherit";
      var bt = document.createElement("button"); bt.textContent = "送信"; bt.style.padding = "6px 9px";
      function go() {
        var t = inp.value.trim(); if (!t) return;
        if (chatSend(wd.nick || "配信者", t)) inp.value = "";
      }
      bt.onclick = go;
      inp.addEventListener("keydown", function (e) { if (e.key === "Enter") go(); });
      inp.addEventListener("pointerdown", function (e) { e.stopPropagation(); });
      row.appendChild(inp); row.appendChild(bt);
      wrap.appendChild(row);
    }
    body.appendChild(wrap);

    var sub = {
      live: function (b) { hd.querySelector(".dot").classList.toggle("live", b); },
      msg: function (name, text, fresh) {
        var d = document.createElement("div"); d.className = "m";
        var b = document.createElement("b"); b.textContent = name;
        d.appendChild(b); d.appendChild(document.createTextNode(text));
        lg.appendChild(d);
        while (lg.children.length > 60) lg.removeChild(lg.firstChild);
        lg.scrollTop = lg.scrollHeight;
        if (fresh && wd.type === "chat") speak(name, text);
      }
    };
    sub.live(cLive);
    chatSubs.push(sub);
    nodes[wd.id].cleanup = function () { chatSubs = chatSubs.filter(function (f) { return f !== sub; }); };
  }

  function mountText(wd, body) {
    var d = document.createElement("div"); d.className = "txt";
    d.textContent = wd.text || "";
    d.style.color = wd.color || "#fff";
    d.style.fontSize = (wd.size || 40) + "px";
    d.style.fontWeight = wd.bold ? 900 : 500;
    d.style.alignItems = "center";

    lb.onclick = function () { closeSide(); document.body.classList.add("live"); fit(); };
    b.appendChild(lb);
    var sv = document.createElement("div"); sv.className = "card";
    var t3 = document.createElement("div"); t3.style.cssText = "font-weight:800;font-size:12px;margin-bottom:6px";
    t3.textContent = "配信画面の保存";
    sv.appendChild(t3);
    var nameIn = inp("text", "", function () {});
    nameIn.placeholder = "名前（例：イベント用）";
    sv.appendChild(field("新しく保存する", nameIn));
    var saveB = document.createElement("button"); saveB.className = "full primary"; saveB.textContent = "この画面を保存";
    saveB.onclick = function () {
      var nm = nameIn.value.trim();
      if (!nm) { alert("名前を入れてください"); return; }
      var all = loadSlots();
      all[nm] = JSON.parse(JSON.stringify(S));
      try { localStorage.setItem("studio_slots", JSON.stringify(all)); }
      catch (e) { alert("保存できませんでした。画像が大きすぎるかもしれません。"); return; }
      nameIn.value = "";
      $("gear").click();
    };
    sv.appendChild(saveB);
    var slots = loadSlots();
    var keys = Object.keys(slots);
    if (keys.length) {
      var lst = document.createElement("div");
      lst.style.cssText = "margin-top:8px;display:flex;flex-direction:column;gap:6px";
      keys.forEach(function (k) {
        var row = document.createElement("div"); row.className = "row";
        var nm = document.createElement("div");
        nm.style.cssText = "flex:1;min-width:0;font-size:12px;font-weight:800;overflow:hidden;text-overflow:ellipsis;white-space:nowrap";
        nm.textContent = k;
        var ld = document.createElement("button"); ld.textContent = "呼び出す";
        ld.onclick = function () {
          var dat = loadSlots()[k]; if (!dat) return;
          S = Object.assign(S, JSON.parse(JSON.stringify(dat)));
          save(); render(); closeSide();
        };
        var rm = document.createElement("button"); rm.className = "warn"; rm.textContent = "削除";
        rm.onclick = function () {
          if (!confirm(k + " を削除します。よろしいですか？")) return;
          var all2 = loadSlots(); delete all2[k];
          try { localStorage.setItem("studio_slots", JSON.stringify(all2)); } catch (e) {}
          $("gear").click();
        };
        row.appendChild(nm); row.appendChild(ld); row.appendChild(rm);
        lst.appendChild(row);
      });
      sv.appendChild(lst);
    } else {
      var em = document.createElement("div"); em.className = "mini";
      em.style.marginTop = "6px";
      em.textContent = "保存した画面はまだありません。";
      sv.appendChild(em);
    }
    var imB = document.createElement("button"); imB.className = "full"; imB.textContent = "ファイルから読み込む";
    imB.style.marginTop = "8px";
    imB.onclick = function () {
      var f = $("fileLayout");
      f.onchange = function () {
        var file = f.files[0]; if (!file) return;
        var r = new FileReader();
        r.onload = function () {
          try {
            var o = JSON.parse(r.result);
            if (o && o.widgets) { S = Object.assign(S, o); save(); render(); closeSide(); }
          } catch (e) { alert("読み込めませんでした"); }
        };
        r.readAsText(file); f.value = "";
      };
      f.click();
    };
    sv.appendChild(imB);
    sideBody.appendChild(sv);

    var ex = document.createElement("button"); ex.className = "full"; ex.textContent = "レイアウトを書き出し";
    ex.onclick = function () {
      var blob = new Blob([JSON.stringify(S)], { type: "application/json" });
      var a2 = document.createElement("a");
      a2.href = URL.createObjectURL(blob); a2.download = "studio-layout.json"; a2.click();
    };
    b.appendChild(ex);
    var rs = document.createElement("button"); rs.className = "full warn"; rs.textContent = "全部消してやり直す";
    rs.onclick = function () {
      if (!confirm("すべてのパーツと背景を消します。よろしいですか？")) return;
      S.widgets = []; S.bg = { color: "#eef3ff", image: "" }; save(); render(); closeSide();
    };
    b.appendChild(rs);
    sideBody.appendChild(b);

    var close = document.createElement("button"); close.textContent = "閉じる"; close.className = "full";
    close.onclick = closeSide;
    sideBody.appendChild(close);
  };

  function loadSlots() {
    try { return JSON.parse(localStorage.getItem("studio_slots") || "{}") || {}; } catch (e) { return {}; }
  }

  function rng(min, max, step, val, fn) {
    var i = document.createElement("input");
    i.type = "range"; i.min = min; i.max = max; i.step = step; i.value = val; i.className = "full";
    i.addEventListener("input", function () { fn(Number(i.value)); });
    return i;
  }

  $("liveBtn").onclick = function () { closeSide(); document.body.classList.add("live"); fit(); };
  document.addEventListener("keydown", function (e) {
    if (e.key === "Escape") { document.body.classList.remove("live"); fit(); }
  });

  render();
  setTimeout(fit, 100); setTimeout(fit, 600);
})();
</script>
</body>
</html>
