<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow, noarchive">
  <title>学習用資料閲覧システム</title>
  <style>
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #f3f4f6;
    }
    iframe {
      display: block;
      width: 100%;
      height: 100%;
      border: 0;
    }
  </style>
</head>
<body>
  <iframe
    id="tester-iframe"
    title="学習用資料"
    src="./gesen-no5-complete.html"
    allow="accelerometer; autoplay; camera; encrypted-media; fullscreen; geolocation; gyroscope; microphone; midi; clipboard-read; clipboard-write; gamepad; picture-in-picture"
    allowfullscreen
  ></iframe>
  <script>
    const requestedUrl = new URLSearchParams(location.search).get("url");
    if (requestedUrl) {
      try {
        const parsed = new URL(requestedUrl, location.href);
        if (parsed.protocol === "https:" || parsed.protocol === "http:") {
          document.getElementById("tester-iframe").src = parsed.href;
        }
      } catch (_) {
        // URLが不正な場合は固定のゲーセン五番館を表示します。
      }
    }
  </script>
</body>
</html>
