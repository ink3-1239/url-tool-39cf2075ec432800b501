<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>スマホ用 配信視聴</title>
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;background:#000;color:#f2f3f7;overflow:hidden;
    font-family:"Hiragino Kaku Gothic ProN","Yu Gothic UI",Meiryo,sans-serif}
  body{display:flex;flex-direction:column}
  #top{flex:0 0 auto;display:flex;align-items:center;gap:8px;padding:10px 12px;
    padding-top:calc(10px + env(safe-area-inset-top));background:#12141c;border-bottom:1px solid #2a2f44}
  #ttl{font-size:13px;font-weight:900;color:#7c5cff;letter-spacing:.05em}
  #dot{width:10px;height:10px;border-radius:50%;background:#ff5470;margin-left:auto}
  #dot.live{background:#3fe081}
  #vwrap{flex:1 1 auto;position:relative;min-height:0;background:#000}
  video{width:100%;height:100%;object-fit:contain;background:#000;display:block}
  #tap{position:absolute;inset:0;display:none;align-items:center;justify-content:center;
    background:rgba(0,0,0,.72);font-size:16px;font-weight:800;color:#fff;text-align:center;padding:20px}
  #tap.on{display:flex}
  #stat{position:absolute;left:8px;top:8px;font-size:11px;color:#dfe3ee;background:rgba(0,0,0,.55);
    padding:5px 9px;border-radius:7px;max-width:92%}
  #bottom{flex:0 0 auto;background:#12141c;border-top:1px solid #2a2f44;
    padding:10px 12px;padding-bottom:calc(12px + env(safe-area-inset-bottom));
    display:flex;flex-direction:column;gap:8px;max-height:46vh;overflow:auto}
  .row{display:flex;gap:8px;align-items:center}
  input,select{flex:1;min-width:0;padding:11px;border-radius:9px;border:1px solid #333850;
    background:#141726;color:#f2f3f7;font:14px/1.3 inherit}
  button{appearance:none;border:1px solid #333850;background:#2a2f44;color:#f2f3f7;
    border-radius:11px;padding:13px 16px;font:800 14px/1 inherit;cursor:pointer}
  button.go{background:#7c5cff;border-color:#7c5cff;color:#fff;flex:1}
  button.stop{background:#ff5470;border-color:#ff5470;color:#fff}
  .rooms{display:flex;flex-direction:column;gap:6px}
  .room{display:flex;align-items:center;gap:8px;padding:11px;border-radius:10px;
    border:1px solid #2a2f44;background:#171a26}
  .room .nm{flex:1;min-width:0;font-size:13px;font-weight:800;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .room .who{font-size:11px;color:#a7adc2}
  .mini{font-size:11px;color:#7f8498;line-height:1.7}
  #chatbox{display:flex;flex-direction:column;gap:6px;border-top:1px solid #2a2f44;padding-top:8px}
  #clog{max-height:26vh;overflow:auto;display:flex;flex-direction:column;gap:5px;
    background:#0d0f16;border:1px solid #2a2f44;border-radius:9px;padding:8px}
  .cm{font-size:13px;line-height:1.5;word-break:break-word}
  .cm b{color:#ffca28;font-size:11.5px;margin-right:6px}
  .cm.sys{color:#7f8498;font-size:11px}
  #cname{max-width:110px;color:#ffca28;font-weight:700}
  body.full #top,body.full #bottom{display:none}
  #exitFull{display:none;position:fixed;left:6px;top:6px;z-index:30;opacity:.25;padding:6px 9px}
  body.full #exitFull{display:block}
</style>
</head>
<body>
<div id="top"><span id="ttl">スマホ用 配信視聴</span><span id="dot"></span></div>
<div id="vwrap">
  <video id="v" playsinline autoplay controls></video>
  <div id="tap">画面をタップすると再生します</div>
  <div id="stat">ルームを選んでください</div>
</div>
<div id="bottom">
  <div class="row">
    <input id="room" placeholder="ルーム名">
    <button id="watch" class="go">見る</button>
  </div>
  <div class="row">
    <button id="full" style="flex:1">全画面</button>
    <button id="reload" style="flex:1">つなぎ直す</button>
    <button id="stopb" class="stop">停止</button>
  </div>
  <div class="mini" id="cnt">配信を探しています…</div>
  <div class="rooms" id="rooms"></div>
  <div class="mini">うまく映らないときは「つなぎ直す」を押してください。中継サーバー経由でつなぐので、モバイル回線でも映ります。</div>
  <div id="chatbox">
    <div id="clog"><div class="cm sys">チャットにつないでいます…</div></div>
    <div class="row">
      <input id="cname" placeholder="名前" maxlength="16">
      <input id="csay" placeholder="メッセージ" maxlength="200">
      <button id="csend">送信</button>
    </div>
  </div>
</div>
<button id="exitFull">◀ 戻る</button>

<script>
(function () {
  "use strict";
  var $ = function (id) { return document.getElementById(id); };
  var SIGNAL = "wss://rendercaster.onrender.com/signal";
  var rtcConfig = {
    iceServers: [
      { urls: "stun:stun.l.google.com:19302" },
      { urls: "stun:stun1.l.google.com:19302" },
      { urls: "turn:openrelay.metered.ca:80", username: "openrelayproject", credential: "openrelayproject" },
      { urls: "turn:openrelay.metered.ca:443", username: "openrelayproject", credential: "openrelayproject" },
      { urls: "turn:openrelay.metered.ca:443?transport=tcp", username: "openrelayproject", credential: "openrelayproject" }
    ],
    iceCandidatePoolSize: 2
  };

  var ws = null, wsTimer = 0, retry = 0;
  var room = "", pc = null, generation = null, pending = {}, session = 0, watching = false;

  function stat(t) { $("stat").textContent = t; }
  function signal(o) { if (ws && ws.readyState === 1) { ws.send(JSON.stringify(o)); return true; } return false; }

  function connect() {
    try { ws = new WebSocket(SIGNAL); } catch (e) { return schedule(); }
    ws.onopen = function () {
      retry = 0; $("dot").classList.add("live");
      if (watching && room) join();
    };
    ws.onmessage = function (ev) {
      var d; try { d = JSON.parse(ev.data); } catch (e) { return; }
      handle(d);
    };
    ws.onclose = function () { $("dot").classList.remove("live"); schedule(); };
    ws.onerror = function () {};
  }
  function schedule() { clearTimeout(wsTimer); retry++; wsTimer = setTimeout(connect, Math.min(1500 * retry, 8000)); }

  function renderRooms(list) {
    var box = $("rooms"); box.innerHTML = "";
    $("cnt").textContent = "配信中のルーム " + list.length + " 件";
    list.forEach(function (r) {
      var d = document.createElement("div"); d.className = "room";
      var nm = document.createElement("div"); nm.className = "nm";
      nm.textContent = r.id;
      var who = document.createElement("div"); who.className = "who";
      who.textContent = r.name ? "配信者：" + r.name : "";
      var b = document.createElement("button");
      b.textContent = "見る";
      b.onclick = function () { $("room").value = r.id; watch(); };
      d.appendChild(nm); d.appendChild(who); d.appendChild(b);
      box.appendChild(d);
    });
  }

  function join() {
    signal({ type: "join", role: "receiver", room: room });
    stat("ルーム「" + room + "」に接続中…");
  }

  function watch() {
    room = $("room").value.trim();
    if (!room) { stat("ルーム名を入れてください"); return; }
    try { localStorage.setItem("pv_room", room); } catch (e) {}
    teardown();
    watching = true; session++;
    if (ws && ws.readyState === 1) join(); else connect();
  }

  function teardown() {
    session++;
    if (pc) { try { pc.close(); } catch (e) {} pc = null; }
    generation = null; pending = {};
    $("v").srcObject = null;
  }

  async function handleOffer(d) {
    if (!watching) return;
    if (generation !== null && d.generation <= generation) return;
    var my = ++session;
    if (pc) { try { pc.close(); } catch (e) {} }
    pc = new RTCPeerConnection(rtcConfig);
    generation = d.generation;
    var self = pc;
    pc.ontrack = function (ev) {
      if (session !== my) return;
      var s = ev.streams[0] || new MediaStream([ev.track]);
      $("v").srcObject = s;
      $("v").play().then(function () { $("tap").classList.remove("on"); })
        .catch(function () { $("tap").classList.add("on"); });
      stat("受信中：" + room);
    };
    pc.onicecandidate = function (ev) {
      if (!ev.candidate || session !== my) return;
      signal({ type: "ice", generation: d.generation, candidate: ev.candidate });
    };
    pc.onconnectionstatechange = function () {
      if (session !== my) return;
      var s = self.connectionState;
      if (s === "connected") stat("接続できました：" + room);
      else if (s === "failed") { stat("つながりませんでした。つなぎ直してください。"); }
      else if (s === "disconnected") stat("接続が不安定です…");
    };
    try {
      await pc.setRemoteDescription(d.sdp);
      var ans = await pc.createAnswer();
      await pc.setLocalDescription(ans);
      signal({ type: "answer", generation: d.generation, sdp: pc.localDescription });
      (pending[d.generation] || []).forEach(function (c) { pc.addIceCandidate(c).catch(function () {}); });
      delete pending[d.generation];
    } catch (e) { stat("接続エラー: " + (e && e.message ? e.message : "")); }
  }

  async function handle(d) {
    if (!d || !d.type) return;
    if (d.type === "room-list") { renderRooms(d.rooms || []); }
    else if (d.type === "offer") { await handleOffer(d); }
    else if (d.type === "ice") {
      if (pc && generation === d.generation && pc.remoteDescription) {
        try { await pc.addIceCandidate(d.candidate); } catch (e) {}
      } else {
        if (!pending[d.generation]) pending[d.generation] = [];
        pending[d.generation].push(d.candidate);
      }
    }
    else if (d.type === "joined") { stat("配信者を待っています…"); }
    else if (d.type === "sender-ready") { stat("配信者に接続中…"); }
    else if (d.type === "sender-left") { teardown(); stat("配信が終了しました"); }
    else if (d.type === "error") { stat("エラー: " + (d.message || "")); }
  }

  $("watch").onclick = watch;
  $("room").addEventListener("keydown", function (e) { if (e.key === "Enter") watch(); });
  $("stopb").onclick = function () { watching = false; signal({ type: "leave" }); teardown(); stat("停止しました"); };
  $("reload").onclick = function () {
    if (!room) { stat("ルーム名を入れてください"); return; }
    teardown(); watching = true;
    if (ws && ws.readyState === 1) {
      signal({ type: "leave" });
      setTimeout(join, 400);
    } else connect();
    stat("つなぎ直しています…");
  };
  $("tap").onclick = function () {
    $("v").play().then(function () { $("tap").classList.remove("on"); }).catch(function () {});
  };
  $("full").onclick = function () {
    document.body.classList.add("full");
    var el = $("vwrap");
    if (el.requestFullscreen) el.requestFullscreen().catch(function () {});
  };
  $("exitFull").onclick = function () {
    document.body.classList.remove("full");
    if (document.fullscreenElement && document.exitFullscreen) document.exitFullscreen().catch(function () {});
  };
  document.addEventListener("keydown", function (e) { if (e.key === "Escape") $("exitFull").click(); });

  /* ---------- チャット ---------- */
  (function () {
    var CHAT_WS = "wss://knj48-ver-chatsystem.onrender.com";
    var cws = null, ctimer = 0, cretry = 0, seen = Object.create(null);
    function cadd(name, text, sys) {
      var d = document.createElement("div");
      d.className = sys ? "cm sys" : "cm";
      if (sys) d.textContent = text;
      else {
        var b = document.createElement("b"); b.textContent = name;
        d.appendChild(b); d.appendChild(document.createTextNode(text));
      }
      var log = $("clog");
      log.appendChild(d);
      while (log.children.length > 80) log.removeChild(log.firstChild);
      log.scrollTop = log.scrollHeight;
    }
    function cconnect() {
      try { cws = new WebSocket(CHAT_WS); } catch (e) { return cschedule(); }
      cws.onopen = function () { cretry = 0; };
      cws.onmessage = function (ev) {
        var d; try { d = JSON.parse(ev.data); } catch (e) { return; }
        if (!d) return;
        var list = Array.isArray(d) ? d : (Array.isArray(d.messages) ? d.messages : [d]);
        list.forEach(function (m) {
          if (!m || typeof m.text !== "string") return;
          var key = (m.timestamp || "") + "|" + (m.senderId || "") + "|" + m.text;
          if (seen[key]) return;
          seen[key] = 1;
          cadd(String(m.senderId || m.name || "ゲスト").slice(0, 20), m.text);
        });
      };
      cws.onclose = function () { cschedule(); };
      cws.onerror = function () {};
    }
    function cschedule() { clearTimeout(ctimer); cretry++; ctimer = setTimeout(cconnect, Math.min(1500 * cretry, 8000)); }
    function csend() {
      var t = $("csay").value.trim(); if (!t) return;
      var nm = $("cname").value.trim() || "ゲスト";
      try { localStorage.setItem("pv_name", nm); } catch (e) {}
      if (!cws || cws.readyState !== 1) { cadd("", "まだつながっていません。", true); return; }
      cws.send(JSON.stringify({ text: t, name: nm }));
      $("csay").value = "";
    }
    $("csend").onclick = csend;
    $("csay").addEventListener("keydown", function (e) { if (e.key === "Enter") csend(); });
    try { $("cname").value = localStorage.getItem("pv_name") || ""; } catch (e) {}
    cconnect();
  })();

  try { $("room").value = localStorage.getItem("pv_room") || ""; } catch (e) {}
  connect();
})();
</script>
</body>
</html>
