入り江をゆっくりと進む。"],brineshrimp:["ブラインシュリンプの雲","ティースプーン一杯のピンクが速く動く。孵化場へは樽単位で売れる。"],saltwraith:["塩の亡霊","ほとんど存在しない。塩が縁を硬く、半ば溶けたように保っている。"],crystalray:["クリスタルエイ","鱗が塩の板に育った。曲がると、ガラスを叩いたように響く。"],brineserpent:["ブラインの大蛇","ほかに生き残るものはいない。何世紀もの間、砂漠を独占してきた。"],brinecrystal:["塩の晶洞","熱で割れ、中は立方体でいっぱい。ここの魚のほとんどより価値がある。"],paintedwrasse:["彩りのベラ","持っているはずのない四色。一日中サンゴの間を出入りしている。"],bannerfish:["ツノダシ","背に高い白い帆。厳格で口うるさい二匹組で群れる。"],parrotfish:["ブダイ","園芸用のはさみのような嘴。サンゴを食べ、あなたが浮いている白い砂を排出する。"],reefmoray:["彩りのウツボ","岩礁に二つの穴があり、その間に口がある。普段は急がないが、動くときは一気に。"],reefsovereign:["礁の君主","棚全体を支配し、そのことをよく知っている。四度捕らえられ、そのたびにフックを保管している。"],bluecatfish:["ブルーキャットフィッシュ","手の長さほどの髭。引き上げられた川の味がする。好みの問題だが。"],mudidol:["泥の偶像","泥の中に二つの目だけを出して横たわる。忍耐強すぎて無礼なほど。"],bowfin:["ボウフィン","河口より古く、河口に変えられてもいない。水が悪くなると空気を吸う。"],estuarypike:["河口のカワカマス","歯のついた矢。潮が変わる茶色い暗がりに潜む。一度、強く打つ。"],mosssback:["苔背の老チョウザメ","背中に庭を載せたチョウザメ。地元の漁師たちは名前を口にし、そっとしておく。"],cityperch:["シティパーチ","窓の高さの群れで泳ぐ。川岸というものを見たことがない。"],neonminnow:["ネオンミノー","内側から光る。腹は赤く、背は青い。今も信号を送っているらしい。"],wireeel:["ワイヤーウナギ","大通りの下を走る導管を縫うように進む。夜、街灯と一緒に出てくる。"],ferryman:["渡し守","大通りの底で、ランプを一つだけともして待つ。運賃を待っているかのように。"],streetlamp:["水没した街灯","九十年海底にあっても、まだ夕暮れには点く。理由は誰にも説明できない。"]},Xi={harbour:{name:"サルトライン港",sub:"母港",tagline:"船をつないでおく場所。",desc:"ありふれた、正直な四つの海域。働く釣り人が知るすべてと、誰も説明できない何か一つ。"},trench:{name:"海溝",sub:"超深海の裂け目",tagline:"二百八十メートルの何もない空間が、まっすぐ立っている。",desc:"裂け目の上には常に嵐が居座る。そこにあるものはすべて透明か、牙があるか、自ら光を放っている。引き上げられれば大金になる。",unlock:"八種の魚を記録する（どこでもよい）"},isle:{name:"古代の島",sub:"水没した神殿の潟",tagline:"誰かがここに建てた。海が異議を唱えた。",desc:"崩れた神殿の上に広がる、鏡のように静かな潟。柱廊を金の鱗の鯉が巡り、沈んだ地下室にはまだ供物が残っている。",unlock:"レア以上の竿を持つ"},ember:{name:"燠火の岩礁",sub:"火山の浅瀬",tagline:"ここの水は温かい。熱すぎるほどに。",desc:"黒い玄武岩、熱水噴出孔、灰の降る空。魚は熱く速く、扉を叩きつけるような勢いで食いつくが、礁は金で報いる。",unlock:"十六種の魚を記録する（どこでもよい）"},floe:{name:"蒼白の北海",sub:"氷下の水路",tagline:"氷に開いた穴から釣る。",desc:"頭上には氷の天井、その下にはオーロラ。あまりに澄んだ冷たさで、世界の底まで見通せる。ナルワルの回遊が年に一度ここを通る。",unlock:"エピック以上の竿を持つ"},reef:{name:"彩りの岩礁",sub:"熱帯の浅瀬",tagline:"小さな色とりどりのものが、どれも急いでいる。",desc:"暖かく、明るく、混み合っていて安い。針が着水するやいなや魚が寄ってきて、ほとんど抵抗しない。連鎖を素早く作るには最適の海。",unlock:"六種の魚を記録する"},kelp:{name:"昆布の大聖堂",sub:"緑の大伽藍",tagline:"光は柱のように差し込み、途中で止まる。",desc:"四十メートルの海藻が柱のように立ち並び、すべてが緑で悠然としている。ガーは藻の間で、柱そのもののように直立している。",unlock:"十二種の魚を記録する"},estuary:{name:"黒水の河口",sub:"茶色く濁った川口",tagline:"底は見えない。何かがこちらを見ている。",desc:"汽水で、タンニンで黒く染まり、九十メートルまで浅く見える。ゆっくりした魚、辛抱強い魚、そして地元の人が口にしたがらないチョウザメ。",unlock:"レア以上の竿を持つ"},armada:{name:"沈没艦隊",sub:"四十隻の墓場",tagline:"上は嵐。下は鉄。",desc:"一度も港に戻らなかった艦隊が、百六十メートルの灰色の水の中に積み重なっている。砲甲板にはハタ、錨鎖にはアナゴ、旗艦はまだ給金を抱えている。",unlock:"二十種の魚を記録する"},glow:{name:"発光の入り江",sub:"生物発光湾",tagline:"水は与えられた光をそのまま保つ。",desc:"鏡のように静かな夜の入り江。すべてが自ら光る。短い釣りと低い抵抗で、メートルあたりの稼ぎが海図で最も高い。掛けた獲物が見えればの話だが。",unlock:"エピック以上の竿を持つ"},city:{name:"水没都市",sub:"九層の海底",tagline:"街灯は今も夕暮れに点く。",desc:"緑がかった黒い水の下に、大通り、アーケード、大聖堂の屋根。窓にはスズキ、導管にはウナギ、大通りの底には灯りを一つともして待つ何かがいる。",unlock:"伝説の竿を持つ"},brine:{name:"ブラインの砂漠",sub:"超高塩分の荒地",tagline:"何も住めない。何かを除いては。",desc:"塩分が濃すぎて、水は底まで乳白色、海藻は水晶に変わった。ここで生きられるものは僅か。そのどれもが、砂漠を独り占めしてきたかのように戦う。",unlock:"二十八種の魚を記録し、エピック以上の竿を持つ"}},D1={"harbour.sunlit":"日なた","harbour.twilight":"薄明","harbour.midnight":"真夜中","harbour.abyss":"深淵","trench.shelf":"棚","trench.wall":"絶壁","trench.hadal":"超深海","trench.rift":"裂け目","isle.shallows":"神殿の浅瀬","isle.colonnade":"柱廊","isle.court":"沈んだ中庭","isle.vault":"王の宝物庫","ember.flats":"燠の干潟","ember.vents":"噴出孔","ember.basalt":"玄武岩の深部","ember.magma":"溶岩棚","floe.underice":"氷下","floe.lead":"水路","floe.cold":"冷たい闇","floe.north":"北の深淵","reef.lagoon":"礁湖","reef.bommies":"珊瑚の群れ","reef.dropoff":"断崖","reef.bluehole":"青の穴","kelp.canopy":"天蓋","kelp.nave":"身廊","kelp.crypt":"林床","kelp.roots":"根","estuary.shallows":"干潟","estuary.channel":"澪筋","estuary.hole":"深みの穴","estuary.sinks":"沈み穴","armada.masts":"帆柱","armada.decks":"砲甲板","armada.holds":"船倉","armada.flagship":"旗艦","glow.mirror":"鏡面","glow.lanterns":"灯火の入り江","glow.deepglow":"深い光","glow.trenchlet":"青い海溝","city.roofs":"屋根","city.avenues":"大通り","city.understreets":"地下街","city.foundations":"基礎","brine.crust":"塩の殻","brine.brinefield":"塩水原","brine.geode":"晶洞の床","brine.basin":"深い盆地"},Ah={cane:["祖父の竹竿","昔の暮らしの玄関の柱を削って作られた。今まで一度も期待を裏切らなかったが、それはどこへも行ったことがないからだ。"],trainer:["練習用ガラス竿","中空のガラス、太めの握り、港の神父のように寛大。折れる前にしなる。"],cork:["港のコルク竿","桟橋で手作りされたコルクに、タールを塗った糸を巻く。船具店の匂いがする。"],tarred:["タール巻き竿","すべての滑車を二重に巻き、松ヤニで黒く塗る。醜い。だが驚くほど強い。"],lancewood:["真鍮金具のランスウッド竿","箱から出された槍材の竿。継ぎ目は、借りのある時計職人が真鍮で仕上げた。"],tidecarbon:["潮溜まりのカーボン竿","黒い編み目、塗装なし、信じられないほど軽い。激流の中を真っ直ぐ鉄を落とす。"],stormspun:["嵐紡ぎの漂流竿","マーサ・アン号の残骸から紡がれた。気圧が下がるとブランクがうなる。"],whaleline:["鯨糸のむち竿","船の予備の鯨糸を巻き取った。自分より大きかったことを覚えている。"],blackglass:["黒曜ガラスのトローラー","火山ガラスを先細りに引き伸ばした。魚が暗闇から、これを見に上がってくる。"],krakenink:["クラーケン墨の竿","乾ききらない墨で漆塗りされている。水にも手にも染みを残す。"],pressure:["高圧鍛造の竿","深海工房で九百気圧のもと鍛えられた。まだ名前のないものに耐えるよう定められている。"],tideglass:["潮ガラスの背骨","淡いガラスの竿に潮が封じられている。バーの振り子は、あなたを待つかのように止まる。"],lamplighter:["灯し人の竿","先端の灯りは、誰も見つけられない芯から供給されている。深いところの魚は、玄関灯に寄る蛾のように集まる。"],leviathan:["怪物の糸竿","非常に大きな動物から切り取られ、誰も引き取らなかったものから編まれている。"],selkie:["セルキーの髪","朝はアザラシの毛皮、夕方は女の姿をしたものから。売られたのではなく、与えられたもの。"],reed:["葦切り竿","河口の上の葦から切り出し、ランプの上で硬化させた。噂のように軽い。"],saltpeter:["硝石のスピン竿","硝石で熟成され、振ると竿が鳴る。かすかに火薬の匂いがする。"],quaymaster:["桟橋長の槍竿","潮の帳簿をつけていた男に支給された。長く、硬く、ありえないほど正確。"],widow:["未亡人の遺品","差出人のない手紙と共に届いた。グリップは、あなたのものではない手の形に磨り減っている。"],longline:["延縄のむち竿","二十メートルの走り糸と、決して震えるのをやめない穂先。大陸棚の縁に届くために作られた。"],bathyscope:["潜水観測の竿","バットのガラスにレンズが研ぎ込まれている。覗くと、闇が形を見せる。"],cartographer:["海図師の竿","巻き糸は海岸線のよう。触れたすべての深さがコルクに刻まれている。"],stormrider:["嵐乗りの投げ竿","どんな天候でも投げられる。マストに縛りつけられ、烈風の中で漁をして、唯一戻ってきたもの。"],worldserpent:["世界蛇の髭","一本の髭が抜け落ちた。今も、どんな水の上でも底の方へ曲がる。"],chronowheel:["クロノリール","説明のつかない余分な歯車を持つリール。見ていない間に後ろへ巻き戻る。"],masterline:["マスターライン","箱の中には入っていない。ほかの二十五本から、あなたが引き上げたすべての変種を紡ぎ直したもの。潮が変わるとブランクが響く。"]},Ch={tideglass:["潮汐の時計","バーの振り子が三十八パーセント遅く動き、パーフェクトキャストごとに通常の上乗せに加えて二十五コイン。"],lamplighter:["灯し人","フックが冷たいランプで燃える。臆病な魚も逃げずに見に来る。深さ六十メートル以下で釣れたものは三十五パーセント多く支払われる。"],leviathan:["不屈","糸は切れることを拒む。切れるはずだった一回を飲み込み、張力は五十五に下がり、魚は体力の四分の一を失う。"],selkie:["セルキーの契約","魚は三十五パーセント穏やかに泳ぎ、疲れるのが一・五倍速くなり、着水ごとに +10 コイン。"],cartographer:["測深","竿は魚の位置を先に知っている。魚は二十八パーセント穏やかに泳ぎ、バーは十二パーセント広い。"],stormrider:["疾風","どんな天候でも投げられる。パワーバーは三十六パーセント遅く振れ、パーフェクトキャストは +30 コイン。"],worldserpent:["ニーズヘッグ","ラウンドならぬ一航海に二度、糸は切れることを拒む。そのバーは、ブランクが許す以上に二十二パーセント広い。"],chronowheel:["第二の潮","着水ごとに +15 コイン。失った魚の進捗は三十八パーセント少なく減る。"],masterline:["マスタリー","あなたが手にしたすべての糸を一本に編み上げたもの。巨大なバー、落ち着いた魚、流れ込む進捗、ほとんど損なわない失敗、三度の切断拒否、二倍のパーフェクト割増、着水ごとに +10 コイン、そして十回に一回は変異して上がってくる。"]},su={pristine:["標準","棚から出したまま。来歴も主張もない。"],tempered:["焼入れ","熱して塩水で焼き入れた。リールを扱う手は速くなるが、ミスの余地は狭まる。"],whiplashed:["しなり","軽く硬く撓められた。驚くほど遠くへ投げ、石のように沈む。巻き取りは渋い。"],gilded:["金箔","すべての巻き糸に金箔。ただの見栄だが、どの釣果にも三割増しの値がつく。"],haunted:["憑依","この竿を通して何かが一度覗き込み、そのまま居ついた。魚は見ようとして針の近くまで寄ってくる。"],abyssal:["深淵","深みで燻され、完全には戻ってこなかった。糸は太く、沈みは速く、コインは深い。"]},Eh={luck:["幸運","水の中の何かがあなたを気に入った。変異して上がる魚が増え、すべての釣果に一割増しのコイン。"],control:["制御","バーが一割広がり、窓そのものが大きくなる。最も寛容なルーン。"],strength:["剛力","魚がバーの中にいる一秒ごとに、十八パーセント多く進む。"],resilience:["耐久","魚を逃したときの進捗の損失が三分の一少ない。雑な手にも罰は軽い。"],attraction:["誘引","針は匂い、唸り、誘いを帯びる。魚は三分の一遠くからでも気づく。"],rapid:["迅速","バーは漂わず手に吸い付くように動き、針は速く沈む。"],steady:["安定","なにが掛かっていても五分の一穏やかに泳ぐ。理由を尋ねた者はいない。"],abyssalline:["深淵の糸","糸は四分の一多く巻かれ、釣ったものすべての深海割増が二倍になる。"],mythical:["神秘","六回に一回は変わった姿で上がる。きらめき、どこか間違っていて、倍以上の価値。通常のコインは少し減る。"],divine:["神聖","パーフェクトの割増が二倍になり、着水ごとに +5 コイン。滑らせなかったことへの一度きりの褒美。"],greedy:["強欲","すべてに三分の一多くのコイン。その欲の代償としてバーは少し狭まる。"],winged:["翼","より遠くへ投げ、速く沈む。パワーバーは金色の帯に狙って止められるほど遅くなる。"]},H1={junk:"ガラクタ",common:"普通",uncommon:"珍しい",rare:"レア",epic:"エピック",legendary:"レジェンド",mythic:"神話",exotic:"異界"},U1={Landlubber:"陸の素人","Bait-runner":"餌運び",Deckhand:"甲板員","Salt Veteran":"潮風の古参","Master Angler":"名人釣り師","Admiral of the Deep":"深海の提督","Harbour Legend":"港の伝説","Tide Marshal":"潮の元帥"},B1={1:{name:"港の補給箱",sub:"船具屋の木箱",blurb:"働く釣り人に必要なものは全部あるが、欲しいものは何もない。扉の横の樽から引き出される。",pityLabel:"レア以上"},2:{name:"深淵の台帳",sub:"海溝が返すもの",blurb:"暗闇から引き上げられた竿。沈んだ木箱、捕鯨ボート、そして自ら浮上してきた一本。",pityLabel:"伝説以上"}},q1={junk:"Debris",common:"Common",uncommon:"Uncommon",rare:"Rare",epic:"Epic",legendary:"Legendary",mythic:"Mythic",exotic:"Exotic"},ut=()=>au()==="ja",At=(i,n)=>ut()?Nh[i]?.[0]??n:n,_h=(i,n)=>ut()?Nh[i]?.[1]
